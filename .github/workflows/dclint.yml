name: Docker Compose Linting

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  check-compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Compose files
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1.6.0
        with:
          path: .
          recursive: true
          formatter: github
          max-warnings: 0

  fix-compose:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fix Compose files
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1.6.0
        continue-on-error: true
        with:
          path: .
          recursive: true
          fix: true
          formatter: stylish

      - name: Detect changes
        run: |
          if git diff --quiet; then
            echo "CHANGES_MADE=false" >> "$GITHUB_ENV"
          else
            git add -u -- '*.yaml' '*.yml'
            echo "CHANGES_MADE=true" >> "$GITHUB_ENV"
          fi

      - name: Check remaining Compose errors
        id: lint-after-fix
        continue-on-error: true
        uses: docker-compose-linter/dclint-github-action@18659f6a7956706cb67cf9c1ad5e55f4352cbc17 # v1.6.0
        with:
          path: .
          recursive: true
          formatter: github
          max-warnings: 0

      - name: Create Pull Request
        if: env.CHANGES_MADE == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "Fix Docker Compose files with dclint"
          title: "Fix Docker Compose lint errors"
          body: |
            Automated fixes produced by `dclint`.
          branch: compose-lint-fixes
          base: main
          delete-branch: true

      - name: Fail on unfixable Compose errors
        if: always() && steps.lint-after-fix.outcome == 'failure'
        run: exit 1
