name: "Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "20 4 * * 1" # Weekly on Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — scan everything but skip posting comments and opening PRs.
          Useful for validating config changes without side-effects.
        type: boolean
        default: false
      scanners:
        description: >
          Which scanners to run. Defaults to all. On push/schedule/PR this input
          is ignored and all scanners always run.
        type: choice
        options:
          - all
          - kics
          - checkov
          - trivy
        default: all
      reopen_findings:
        description: >
          Reprocess dismissed suppression PRs (those closed without merging).
          Pass 'all' to reprocess every dismissed finding currently in the scan
          results, or a comma-separated list of similarity_id prefixes (minimum
          8 chars, e.g. "fe37c69c,87a31c47"). Only findings that still appear in
          the KICS scan output are affected — findings that no longer exist in
          the codebase are ignored automatically. Leave blank for normal
          behaviour.
        type: string
        default: ""
      pr_limit:
        description: >
          Maximum number of suppression PRs to open in a single run (default:
          20). Prevents runaway PR creation when many new findings appear at
          once. Run the workflow again or increase the limit to process
          remaining findings.
        type: string
        default: "20"

# ── Convenience expressions used throughout ───────────────────────────────
# is_pr    : true on pull_request only
# is_push  : true on push + schedule (the "post to commit" triggers)
# is_manual: true on workflow_dispatch only
# post_ok  : true when it is safe to post comments / open PRs
#            (not a PR, and not a dry run)
# Each job re-evaluates these inline; GitHub does not support top-level vars
# that reference github.* context, so they are inlined as needed.

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Misconfiguration scanning
  #   - Checkov  → .github/workflows/ (best-in-class for Actions files)
  #   - KICS     → compose.yaml files (best-in-class for Compose files)
  #
  # PR trigger:         scans changed files → GitHub code scanning
  # push/schedule:      full scan           → GitHub code scanning + summary
  # workflow_dispatch:  full scan           → GitHub code scanning + summary
  #                     (dry_run=true skips the comment)
  #                     (scanners=kics/checkov limits which tool runs)
  # Blocks merge:       CRITICAL/HIGH findings
  # ─────────────────────────────────────────────────────────────────────────
  misconfig:
    name: Misconfiguration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate KICS exclusions
        run: python3 .github/scripts/validate-kics-exclusions.py

      - name: Validate synchronized KICS pins
        run: python3 .github/scripts/security_scan.py verify-kics-pins

      # Build the exclude_results list from .kics-exclude/ on origin/main.
      # Reading from origin/main (not the checked-out branch) ensures PR scans
      # always use the latest suppressions, even if the PR branch was created
      # before a suppression PR was merged. Without this, a suppression merged
      # to main after the PR branch was cut would be invisible to PR scans,
      # causing false-positive check failures on already-suppressed findings.
      - name: Build KICS exclude list
        id: kics-exclude
        run: |
          # Fetch only the .kics-exclude/ tree from origin/main so we always
          # have the current set of suppressions regardless of branch age.
          git fetch origin main --depth=1 --no-tags --filter=blob:none 2>/dev/null || true
          python3 .github/scripts/security_scan.py exclusions

      # Resolve the KICS scan path from git rather than interpolating
      # pull-request-controlled filenames into shell source. PRs scan every
      # changed deployment YAML file, including Compose fragments. Other
      # triggers scan the full repository.
      - name: Resolve KICS scan path
        id: kics-path
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/scripts/security_scan.py kics-plan
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Get changed workflow files
        id: workflow-changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            .github/workflows/**

      # ── Checkov ──────────────────────────────────────────────────────────
      # On workflow_dispatch, the `scanners` input gates whether this runs.
      # On all other triggers it always runs (subject to the PR diff guard).
      - name: Run Checkov
        id: checkov
        if: |
          (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'checkov'
          ) && (
            github.event_name != 'pull_request' ||
            steps.workflow-changed.outputs.any_changed == 'true'
          )
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        continue-on-error: true
        with:
          directory: .github/workflows
          config_file: .checkov.yaml
          quiet: true
          output_format: cli,json,sarif
          output_file_path: checkov-results/results_cli.txt,checkov-results/results_json.json,checkov-results/results_sarif.sarif

      - name: Upload Checkov results to GitHub code scanning
        if: always() && hashFiles('checkov-results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov-github-actions

      # ── KICS ─────────────────────────────────────────────────────────────
      - name: Checkout pinned KICS queries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Checkmarx/kics
          ref: e1f23cad9640f55b963f22a116b04906b8c16ac6 # v2.1.20
          path: .cache/kics-source

      - name: Install checksum-pinned KICS
        run: >-
          python3 .github/scripts/security_scan.py install-kics
          --destination "$RUNNER_TEMP/kics"

      - name: Run KICS
        id: kics
        if: |
          always() &&
          steps.kics-path.outputs.skip != 'true' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'kics'
          )
        env:
          KICS_PATH: ${{ steps.kics-path.outputs.path }}
        run: |
          set +e
          python3 .github/scripts/security_scan.py kics \
            --path "$KICS_PATH" \
            --formats json,sarif \
            --output kics-results \
            --queries .cache/kics-source/assets/queries \
            --libraries .cache/kics-source/assets/libraries \
            --exclude-results "${{ steps.kics-exclude.outputs.list }}" \
            --executable "$RUNNER_TEMP/kics"
          KICS_EXIT=$?
          set -e
          echo "exit_code=$KICS_EXIT" >> "$GITHUB_OUTPUT"

      # KICS similarity IDs can change when a finding moves. Apply the same
      # stable rule-and-file suppression fallback used by the blocking step
      # before publishing results to GitHub code scanning.
      - name: Filter suppressed KICS results from SARIF
        if: always() && hashFiles('kics-results/results.sarif') != ''
        run: |
          SUPPRESSED=$(git ls-tree -r --name-only origin/main -- .kics-exclude/ \
            | xargs -I{} basename {} 2>/dev/null || true)

          jq --arg suppressed "$SUPPRESSED" '
            def slug:
              gsub("[/ ]"; "-") |
              gsub("[^A-Za-z0-9._-]"; "") |
              .[0:60];

            .runs |= map(
              .tool.driver.rules as $rules |
              .results |= [
                .[] |
                . as $finding |
                (first($rules[] | select(.id == $finding.ruleId)) // {}) as $rule |
                ($finding.locations[0].physicalLocation.artifactLocation.uri // "") as $path |
                (($rule.name // $finding.ruleId) | slug) as $query_slug |
                ($path | slug) as $file_slug |
                (($rule.defaultConfiguration.level // "warning") == "error") as $blocking |
                ("HIGH_" + $query_slug + "_" + $file_slug + "_") as $high_prefix |
                ("CRITICAL_" + $query_slug + "_" + $file_slug + "_") as $critical_prefix |
                select($blocking) |
                select(($suppressed | split("\n") | any(
                  startswith($high_prefix) or startswith($critical_prefix)
                )) | not)
              ]
            )
          ' kics-results/results.sarif > kics-results/results.filtered.sarif

      - name: Upload KICS results to GitHub code scanning
        if: always() && hashFiles('kics-results/results.filtered.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: kics-results/results.filtered.sarif
          category: kics-compose

      # ── push/schedule/dispatch: workflow run summary ──────────────────────
      # Skipped when dry_run=true so no side-effects are left behind.
      - name: Format summary comment
        if: always() && github.event_name != 'pull_request'
        run: |
          # KICS
          if [ -f kics-results/results.json ]; then
            KICS_TOTAL=$(jq '[.queries[].files[]] | length' kics-results/results.json)
            KICS_HIGH=$(jq '[.queries[] | select(.severity=="HIGH" or .severity=="CRITICAL") | .files[]] | length' kics-results/results.json)
            KICS_BODY=$(jq -r '
              .queries[] | select(.files | length > 0) |
              "[\(.severity)] \(.query_name)\n" +
              (.files[] | "  → \(.file_name):\(.line)\n")
            ' kics-results/results.json 2>/dev/null || echo "Could not parse results.")
          else
            KICS_TOTAL=0; KICS_HIGH=0; KICS_BODY="No results."
          fi

          # Checkov
          if [ -f checkov-results/results_cli.txt ]; then
            CHECKOV_BODY=$(cat checkov-results/results_cli.txt)
          else
            CHECKOV_BODY="No results."
          fi

          # Append a banner when this was a manual dry-run
          DRY_NOTE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_NOTE="> ⚠️ **Dry run** — results are shown for visibility only. No PRs were opened."$'\n\n'
          fi

          # Append which scanners were selected (workflow_dispatch only)
          SCANNER_NOTE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scanners }}" != "all" ]; then
            SCANNER_NOTE="> ℹ️ **Partial scan** — only \`${{ inputs.scanners }}\` ran this time."$'\n\n'
          fi

          cat <<COMMENT > misconfig-summary.md
          ## 🔍 Misconfiguration Scan — $(date -u +"%Y-%m-%d %H:%M UTC")

          ${DRY_NOTE}${SCANNER_NOTE}**KICS:** ${KICS_TOTAL} finding(s) — ${KICS_HIGH} HIGH/CRITICAL

          <details><summary>KICS findings</summary>

          \`\`\`
          ${KICS_BODY}
          \`\`\`
          </details>

          <details><summary>Checkov findings</summary>

          \`\`\`
          ${CHECKOV_BODY}
          \`\`\`
          </details>
          COMMENT

      - name: Post misconfig summary
        if: |
          always() &&
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.dry_run == false
          )
        run: cat misconfig-summary.md >> $GITHUB_STEP_SUMMARY

      # ── Block on CRITICAL/HIGH ─────────────────────────────────────────
      # Always runs regardless of trigger or dry_run — findings are findings.
      # Treat a non-zero scanner exit or a missing report as a hard failure.
      #
      # Secondary suppression filter: --exclude-results filters by sim_id, but
      # sim_ids drift when a file is modified in a PR (KICS recomputes the hash
      # from changed content). As a fallback, filter out any HIGH/CRITICAL finding
      # whose (severity, query_name, file_name) combination matches a .kics-exclude/
      # filename on origin/main -- i.e., the finding was previously suppressed for
      # that file regardless of which exact line or version triggered it.
      - name: Block on CRITICAL/HIGH findings
        if: always()
        run: |
          BLOCK=0

          if [ "${{ steps.kics.outcome }}" = "failure" ] || \
             { [ "${{ steps.kics.outcome }}" = "success" ] && \
               { [ "${{ steps.kics.outputs.exit_code }}" != "0" ] || \
                 [ ! -f kics-results/results.json ]; }; }; then
            echo "::error::KICS scan failed to produce results. Check for docker pull errors above."
            BLOCK=1
          elif [ -f kics-results/results.json ]; then
            # Build suppression index from .kics-exclude/ filenames on origin/main.
            # Each filename encodes: {SEVERITY}_{QuerySlug}_{FileSlug}_L{line}_{sim8}
            # We match on the {SEVERITY}_{QuerySlug}_{FileSlug}_ prefix, which is
            # stable even when line numbers or sim_ids change due to file edits.
            SUPPRESSED=$(git ls-tree -r --name-only origin/main -- .kics-exclude/ 2>/dev/null \
              | xargs -I{} basename {} 2>/dev/null || true)

            COUNT=0
            while IFS= read -r finding; do
              SEV=$(echo "$finding"   | jq -r '.severity')
              QNAME=$(echo "$finding" | jq -r '.query_name')
              FNAME=$(echo "$finding" | jq -r '.file_name')
              # Derive slug prefix matching exclude_filename() in kics-pr-manager.py
              Q_SLUG=$(echo "$QNAME" | sed 's|[/ \\]|-|g; s|[^A-Za-z0-9._-]||g' | cut -c1-60)
              F_SLUG=$(echo "$FNAME" | sed 's|[/ \\]|-|g; s|[^A-Za-z0-9._-]||g' | cut -c1-60)
              PREFIX="${SEV}_${Q_SLUG}_${F_SLUG}_"
              # Check if any .kics-exclude filename starts with this prefix
              if echo "$SUPPRESSED" | grep -q "^${PREFIX}"; then
                echo "  suppressed by name match: ${SEV} ${QNAME} in ${FNAME}"
              else
                echo "  unsuppressed finding: ${SEV} ${QNAME} in ${FNAME}"
                COUNT=$((COUNT + 1))
              fi
            done < <(jq -c '.queries[] | select(.severity=="CRITICAL" or .severity=="HIGH") | . as $q | .files[] | {severity: $q.severity, query_name: $q.query_name, file_name: .file_name}' kics-results/results.json)

            if [ "$COUNT" -gt 0 ]; then
              echo "::error::KICS: $COUNT new CRITICAL/HIGH finding(s) -- see GitHub code scanning"
              BLOCK=1
            fi
          fi

          if [ "${{ steps.checkov.outcome }}" = "failure" ]; then
            echo "::error::Checkov: failed checks found -- see GitHub code scanning"
            BLOCK=1
          fi

          exit $BLOCK

  vulnerabilities:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    # PRs are excluded: Trivy has no per-line context for annotations, and
    # every step was already guarded with != 'pull_request', making the entire
    # job a no-op on PRs — it checked out the repo and did nothing.
    # Vuln coverage on PRs comes from the weekly schedule catching any new
    # CVE in dependencies, and from the push scan that runs after merge.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run on push, schedule, and workflow_dispatch (never on PR — no file:line
      # context makes annotations low-value; the full scan runs on merge).
      # On workflow_dispatch, the `scanners` input gates execution.
      - name: Run Trivy
        id: trivy
        if: |
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'trivy'
          )
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          skip-dirs: .git,.cache
          exit-code: 0
          # cache-dir must be set in with: as well as env: — the action's
          # internal setup-trivy step reads the input to key actions/cache,
          # and ignores TRIVY_CACHE_DIR for that purpose.
          cache-dir: ${{ github.workspace }}/.cache/trivy

      - name: Convert Trivy results to SARIF
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results.sarif \
            trivy-results.json

      - name: Upload Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Format Trivy summary
        if: always() && github.event_name != 'pull_request'
        run: |
          trivy fs . \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --skip-dirs .git,.cache \
            --format table \
            --output trivy-table.txt \
            2>/dev/null || true

          TRIVY_BODY=$(cat trivy-table.txt 2>/dev/null || echo "No results.")

          DRY_NOTE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_NOTE="> ⚠️ **Dry run** — results are shown for visibility only. No PRs were opened."$'\n\n'
          fi

          cat <<COMMENT > vuln-summary.md
          ## 🛡️ Vulnerability Scan — $(date -u +"%Y-%m-%d %H:%M UTC")

          ${DRY_NOTE}
          <details><summary>Trivy CVE findings</summary>

          \`\`\`
          ${TRIVY_BODY}
          \`\`\`
          </details>
          COMMENT

      - name: Post vulnerability summary
        if: |
          always() &&
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.dry_run == false
          )
        run: cat vuln-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Block on CRITICAL/HIGH CVEs
        if: always()
        run: |
          if [ ! -f trivy-results.json ]; then exit 0; fi
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Trivy: $COUNT CRITICAL/HIGH CVE(s) found — see GitHub code scanning"
            exit 1
          fi

  # Resolve digest-pinned images to scan. Pushes and pull requests scan images
  # from changed Compose files for immediate feedback. Schedules and manual
  # Trivy runs scan the full inventory and are the only runs that publish SARIF:
  # GitHub treats each category as a complete snapshot, so a partial upload to a
  # shared bucket could incorrectly close alerts for images omitted from it.
  image-scan-plan:
    name: Plan Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      full_inventory: ${{ steps.plan.outputs.full_inventory }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test security scan helpers
        run: >-
          python3 -m unittest discover
          --start-directory .github/scripts
          --pattern 'test_*.py'

      - name: Build image scan matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTED_SCANNERS: ${{ inputs.scanners }}
        run: |
          python3 .github/scripts/security_scan.py plan \
            --event "$EVENT_NAME" \
            --before "$BEFORE_SHA" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --scanners "${SELECTED_SCANNERS:-all}"

  image-vulnerabilities:
    name: Container Image Scan (${{ matrix.id }})
    needs: image-scan-plan
    if: |
      needs.image-scan-plan.outputs.count != '0' ||
      needs.image-scan-plan.outputs.full_inventory == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.image-scan-plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Scan images
        id: scan
        env:
          IMAGES: ${{ matrix.images }}
        run: |
          mkdir -p trivy-image-results
          ERRORS=0
          INDEX=0
          for image in $IMAGES; do
            INDEX=$((INDEX + 1))
            echo "Scanning $image"
            REPORT="trivy-image-results/image-${INDEX}.sarif"
            if ! trivy image \
              --scanners vuln \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --format sarif \
              --output "$REPORT" \
              "$image"; then
              echo "::error::Trivy could not scan $image"
              ERRORS=$((ERRORS + 1))
            elif [ ! -s "$REPORT" ]; then
              echo "::error::Trivy did not produce SARIF for $image"
              ERRORS=$((ERRORS + 1))
            elif ! python3 .github/scripts/security_scan.py normalize-image-sarif \
              --input "$REPORT" \
              --output "$REPORT" \
              --image "$image"; then
              echo "::error::Could not normalize SARIF identity for $image"
              ERRORS=$((ERRORS + 1))
            fi
            if ! trivy clean --scan-cache; then
              echo "::warning::Trivy scan cache cleanup failed"
            fi
          done
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"

      - name: Combine image scan results
        id: combine
        if: |
          always() &&
          steps.scan.outputs.errors == '0' && (
            needs.image-scan-plan.outputs.full_inventory == 'true' ||
            hashFiles('trivy-image-results/image-*.sarif') != ''
          )
        run: |
          python3 .github/scripts/security_scan.py combine \
            --pattern 'trivy-image-results/image-*.sarif' \
            --output trivy-image-results/combined.sarif

      - name: Summarize changed-image findings
        if: |
          always() &&
          needs.image-scan-plan.outputs.full_inventory != 'true' &&
          steps.combine.outcome == 'success'
        run: |
          COUNT=$(jq '[.runs[]?.results[]?] | length' trivy-image-results/combined.sarif)
          {
            echo "## Changed-image vulnerability scan"
            echo
            echo "Trivy found **${COUNT}** HIGH/CRITICAL result(s)."
            echo "The authoritative code-scanning baseline updates only after a complete scan."
            if [ "$COUNT" -gt 0 ]; then
              echo
              jq -r '
                [.runs[]?.results[]? |
                  {rule: .ruleId, detail: ((.message.text // "") | split("\n")[0])}] |
                unique_by([.rule, .detail]) | .[:50][] |
                "- **\(.rule)** — \(.detail)"
              ' trivy-image-results/combined.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage complete bucket SARIF
        if: |
          always() &&
          needs.image-scan-plan.outputs.full_inventory == 'true' &&
          steps.scan.outputs.errors == '0' &&
          steps.combine.outcome == 'success' &&
          hashFiles('trivy-image-results/combined.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-results-${{ matrix.id }}
          path: trivy-image-results/combined.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Fail on scanner errors
        if: always() && steps.scan.outputs.errors != '0'
        run: exit 1

  # Publish only after every full-inventory bucket has scanned successfully.
  # This prevents any category from being replaced by an incomplete run when a
  # different matrix job fails later.
  image-vulnerability-publish:
    name: Publish Container Image Scan (${{ matrix.id }})
    needs: [image-scan-plan, image-vulnerabilities]
    if: |
      always() &&
      needs.image-scan-plan.result == 'success' &&
      needs.image-scan-plan.outputs.full_inventory == 'true' &&
      needs.image-vulnerabilities.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.image-scan-plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download complete bucket SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-image-results-${{ matrix.id }}
          path: trivy-image-results

      - name: Upload image results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-image-results/combined.sarif
          category: trivy-images-${{ matrix.id }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Per-finding suppression PRs
  #
  # Runs on push to main, schedule, and workflow_dispatch.
  # dry_run=true → skips the PR-opening step (scan still runs so you can
  #                inspect what *would* have been opened).
  #
  # Suppressions are stored as one reviewed finding per .kics-exclude/ file.
  # ─────────────────────────────────────────────────────────────────────────
  fix-prs:
    name: Generate Fix PRs
    runs-on: ubuntu-latest
    # push is excluded: every merge to main previously triggered a full KICS
    # scan + PR manager run. Since most findings are already dismissed or have
    # an open PR, push runs were almost always no-ops and caused unnecessary
    # load. schedule (weekly) provides the safety net; workflow_dispatch
    # (with reopen_findings input) covers any on-demand needs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Build the exclude_results list from committed .kics-exclude/ files.
      # Each file contains one similarity_id written by a previous merged PR.
      # The list is passed directly to the action's exclude_results input —
      # replacing the old inject-to-yaml approach which was fragile and required
      # .kics-exclude/ to be non-empty or the yaml would be malformed.
      # Build the exclude_results list from .kics-exclude/ on origin/main.
      # fix-prs always runs on schedule/dispatch from main, so origin/main
      # equals HEAD here -- but using the same approach as misconfig keeps
      # the two jobs consistent.
      - name: Build KICS exclude list
        id: kics-exclude
        run: |
          git fetch origin main --depth=1 --no-tags --filter=blob:none 2>/dev/null || true
          python3 .github/scripts/security_scan.py exclusions

      - name: Validate synchronized KICS pins
        run: python3 .github/scripts/security_scan.py verify-kics-pins

      - name: Checkout pinned KICS queries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Checkmarx/kics
          ref: e1f23cad9640f55b963f22a116b04906b8c16ac6 # v2.1.20
          path: .cache/kics-source

      - name: Install checksum-pinned KICS
        run: >-
          python3 .github/scripts/security_scan.py install-kics
          --destination "$RUNNER_TEMP/kics"

      # Full scan — not scoped to changed files; catches anything on main.
      # --exclude-severities medium,low,info — only open PRs for HIGH/CRITICAL.
      - name: Run KICS (full scan)
        run: |
          python3 .github/scripts/security_scan.py kics \
            --path . \
            --formats json \
            --output kics-results \
            --queries .cache/kics-source/assets/queries \
            --libraries .cache/kics-source/assets/libraries \
            --exclude-severities medium,low,info \
            --exclude-results "${{ steps.kics-exclude.outputs.list }}" \
            --executable "$RUNNER_TEMP/kics"

      # One PR per finding. Closed-without-merge → permanently dismissed
      # unless --reopen is set (via the reopen_findings dispatch input).
      # --pr-limit caps PRs opened per run (default 20, overridable via input).
      # Skipped entirely on dry_run so no branches or PRs are created.
      - name: Open per-finding suppression PRs
        if: inputs.dry_run == false || github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REOPEN_ARG=""
          if [ -n "${{ inputs.reopen_findings }}" ]; then
            REOPEN_ARG="--reopen ${{ inputs.reopen_findings }}"
          fi
          LIMIT="${{ inputs.pr_limit }}"
          LIMIT_ARG="--pr-limit ${LIMIT:-20}"
          python3 .github/scripts/kics-pr-manager.py \
            --kics  kics-results/results.json \
            --repo  ${{ github.repository }} \
            --token "$GITHUB_TOKEN" \
            --base  main \
            $LIMIT_ARG \
            $REOPEN_ARG

      # Log a notice when dry_run suppressed PR creation so the run summary
      # makes the skipped action obvious.
      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "::notice::Dry run — KICS scan completed but no suppression PRs were opened."
          echo "          Re-run with dry_run=false to open PRs for the findings above."

      - name: Clean up scan artifacts
        if: always()
        run: sudo rm -rf kics-results/

  notify:
    name: Notify
    needs:
      - misconfig
      - vulnerabilities
      - image-scan-plan
      - image-vulnerabilities
      - image-vulnerability-publish
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ping healthchecks
        env:
          HC_URL: ${{ secrets.HC_SECURITY_SCAN }}
        run: |
          [ -z "$HC_URL" ] && exit 0
          if [ "${{ needs.misconfig.result }}" = "success" ] && \
             [ "${{ needs.vulnerabilities.result }}" = "success" ] && \
             [ "${{ needs.image-scan-plan.result }}" = "success" ] && \
              { [ "${{ needs.image-vulnerabilities.result }}" = "success" ] || \
                [ "${{ needs.image-vulnerabilities.result }}" = "skipped" ]; } && \
              { [ "${{ needs.image-vulnerability-publish.result }}" = "success" ] || \
                [ "${{ needs.image-vulnerability-publish.result }}" = "skipped" ]; }; then
            curl -fsS --retry 3 "$HC_URL" > /dev/null || true
          else
            curl -fsS --retry 3 "${HC_URL}/fail" > /dev/null || true
          fi
