name: "Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "20 4 * * 1" # Weekly on Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — scan everything but skip posting comments and opening PRs.
          Useful for validating config changes without side-effects.
        type: boolean
        default: false
      scanners:
        description: >
          Which scanners to run. Defaults to all. On push/schedule/PR this input
          is ignored and all scanners always run.
        type: choice
        options:
          - all
          - kics
          - checkov
          - trivy
        default: all
# ── Convenience expressions used throughout ───────────────────────────────
# is_pr    : true on pull_request only
# is_push  : true on push + schedule (the "post to commit" triggers)
# is_manual: true on workflow_dispatch only
# post_ok  : true when it is safe to post comments / open PRs
#            (not a PR, and not a dry run)
# Each job re-evaluates these inline; GitHub does not support top-level vars
# that reference github.* context, so they are inlined as needed.

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Misconfiguration scanning
  #   - Checkov  → .github/workflows/ (best-in-class for Actions files)
  #   - KICS     → compose.yaml files (best-in-class for Compose files)
  #
  # PR trigger:         scans changed files → GitHub code scanning
  # push/schedule:      full scan           → GitHub code scanning + summary
  # workflow_dispatch:  full scan           → GitHub code scanning + summary
  #                     (dry_run=true skips the comment)
  #                     (scanners=kics/checkov limits which tool runs)
  # Blocks merge:       CRITICAL/HIGH findings
  # ─────────────────────────────────────────────────────────────────────────
  misconfig:
    name: Misconfiguration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate KICS exclusions
        run: python3 .github/scripts/validate-kics-exclusions.py

      - name: Validate synchronized KICS pins
        run: python3 .github/scripts/security_scan.py verify-kics-pins

      - name: Fetch reviewed KICS suppressions
        run: >-
          git fetch origin
          +refs/heads/main:refs/remotes/origin/main
          --depth=1 --no-tags --filter=blob:none

      # Resolve the KICS scan path from git rather than interpolating
      # pull-request-controlled filenames into shell source. PRs scan every
      # changed deployment YAML file, including Compose fragments. Other
      # triggers scan the full repository.
      - name: Resolve KICS scan path
        id: kics-path
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/scripts/security_scan.py kics-plan
          --event "$EVENT_NAME"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Get changed workflow files
        id: workflow-changed
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            .github/workflows/**

      # ── Checkov ──────────────────────────────────────────────────────────
      # On workflow_dispatch, the `scanners` input gates whether this runs.
      # On all other triggers it always runs (subject to the PR diff guard).
      - name: Run Checkov
        id: checkov
        if: |
          (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'checkov'
          ) && (
            github.event_name != 'pull_request' ||
            steps.workflow-changed.outputs.any_changed == 'true'
          )
        uses: bridgecrewio/checkov-action@59b9d7edfcad5b87fbe3f473a9a134a721ad03f8 # v12.3119.0
        continue-on-error: true
        with:
          directory: .github/workflows
          config_file: .checkov.yaml
          quiet: true
          output_format: cli,json,sarif
          output_file_path: checkov-results/results_cli.txt,checkov-results/results_json.json,checkov-results/results_sarif.sarif

      - name: Upload Checkov results to GitHub code scanning
        if: always() && hashFiles('checkov-results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov-github-actions

      # ── KICS ─────────────────────────────────────────────────────────────
      - name: Checkout pinned KICS queries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Checkmarx/kics
          ref: e1f23cad9640f55b963f22a116b04906b8c16ac6 # v2.1.20
          path: .cache/kics-source

      - name: Install checksum-pinned KICS
        run: >-
          python3 .github/scripts/security_scan.py install-kics
          --destination "$RUNNER_TEMP/kics"

      - name: Run KICS
        id: kics
        if: |
          always() &&
          steps.kics-path.outputs.skip != 'true' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'kics'
          )
        env:
          KICS_PATH: ${{ steps.kics-path.outputs.path }}
        run: |
          set +e
          python3 .github/scripts/security_scan.py kics \
            --path "$KICS_PATH" \
            --formats json,sarif \
            --output kics-results \
            --queries .cache/kics-source/assets/queries \
            --libraries .cache/kics-source/assets/libraries \
            --executable "$RUNNER_TEMP/kics"
          KICS_EXIT=$?
          set -e
          echo "exit_code=$KICS_EXIT" >> "$GITHUB_OUTPUT"

      - name: Verify proposed KICS suppression changes
        if: github.event_name == 'pull_request' && hashFiles('kics-results/results.json') != ''
        run: >-
          python3 .github/scripts/security_scan.py verify-kics-exclusions
          --json kics-results/results.json

      - name: Apply reviewed KICS finding suppressions
        if: always() && hashFiles('kics-results/results.sarif') != ''
        run: >-
          python3 .github/scripts/security_scan.py filter-kics
          --json kics-results/results.json
          --sarif kics-results/results.sarif
          --json-output kics-results/results.filtered.json
          --sarif-output kics-results/results.filtered.sarif

      - name: Upload KICS results to GitHub code scanning
        if: always() && hashFiles('kics-results/results.filtered.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: kics-results/results.filtered.sarif
          category: kics-compose

      # ── push/schedule/dispatch: workflow run summary ──────────────────────
      # Skipped when dry_run=true so no side-effects are left behind.
      - name: Format summary comment
        if: always() && github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELECTED_SCANNERS: ${{ inputs.scanners }}
        run: |
          # KICS
          if [ -f kics-results/results.filtered.json ]; then
            KICS_TOTAL=$(jq '[.queries[].files[]] | length' kics-results/results.filtered.json)
            KICS_HIGH=$(jq '[.queries[] | select(.severity=="HIGH" or .severity=="CRITICAL") | .files[]] | length' kics-results/results.filtered.json)
            KICS_BODY=$(jq -r '
              .queries[] | select(.files | length > 0) |
              "[\(.severity)] \(.query_name)\n" +
              (.files[] | "  → \(.file_name):\(.line)\n")
            ' kics-results/results.filtered.json 2>/dev/null || echo "Could not parse results.")
          else
            KICS_TOTAL=0; KICS_HIGH=0; KICS_BODY="No results."
          fi

          # Checkov
          if [ -f checkov-results/results_cli.txt ]; then
            CHECKOV_BODY=$(cat checkov-results/results_cli.txt)
          else
            CHECKOV_BODY="No results."
          fi

          # Append a banner when this was a manual dry-run
          DRY_NOTE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            DRY_NOTE="> ⚠️ **Dry run** — results are shown for visibility only. No PRs were opened."$'\n\n'
          fi

          # Append which scanners were selected (workflow_dispatch only)
          SCANNER_NOTE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SELECTED_SCANNERS" != "all" ]; then
            SCANNER_NOTE="> ℹ️ **Partial scan** — only \`$SELECTED_SCANNERS\` ran this time."$'\n\n'
          fi

          cat <<COMMENT > misconfig-summary.md
          ## 🔍 Misconfiguration Scan — $(date -u +"%Y-%m-%d %H:%M UTC")

          ${DRY_NOTE}${SCANNER_NOTE}**KICS:** ${KICS_TOTAL} finding(s) — ${KICS_HIGH} HIGH/CRITICAL

          <details><summary>KICS findings</summary>

          \`\`\`
          ${KICS_BODY}
          \`\`\`
          </details>

          <details><summary>Checkov findings</summary>

          \`\`\`
          ${CHECKOV_BODY}
          \`\`\`
          </details>
          COMMENT

      - name: Post misconfig summary
        if: |
          always() &&
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.dry_run == false
          )
        run: cat misconfig-summary.md >> "$GITHUB_STEP_SUMMARY"

      # ── Block on CRITICAL/HIGH ─────────────────────────────────────────
      # Always runs regardless of trigger or dry_run — findings are findings.
      # Treat a non-zero scanner exit or a missing report as a hard failure.
      #
      - name: Block on CRITICAL/HIGH findings
        if: always()
        run: |
          BLOCK=0

          if [ "${{ steps.kics.outcome }}" = "failure" ] || \
             { [ "${{ steps.kics.outcome }}" = "success" ] && \
               { [ "${{ steps.kics.outputs.exit_code }}" != "0" ] || \
                  [ ! -f kics-results/results.filtered.json ]; }; }; then
            echo "::error::KICS scan failed to produce results. Check for docker pull errors above."
            BLOCK=1
          elif [ -f kics-results/results.filtered.json ]; then
            COUNT=$(jq '[.queries[] | select(.severity=="CRITICAL" or .severity=="HIGH") | .files[]] | length' kics-results/results.filtered.json)

            if [ "$COUNT" -gt 0 ]; then
              echo "::error::KICS: $COUNT new CRITICAL/HIGH finding(s) -- see GitHub code scanning"
              BLOCK=1
            fi
          fi

          if [ "${{ steps.checkov.outcome }}" = "failure" ]; then
            echo "::error::Checkov: failed checks found -- see GitHub code scanning"
            BLOCK=1
          fi

          exit $BLOCK

  vulnerabilities:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    # PRs are excluded: Trivy has no per-line context for annotations, and
    # every step was already guarded with != 'pull_request', making the entire
    # job a no-op on PRs — it checked out the repo and did nothing.
    # Vuln coverage on PRs comes from the weekly schedule catching any new
    # CVE in dependencies, and from the push scan that runs after merge.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Run on push, schedule, and workflow_dispatch (never on PR — no file:line
      # context makes annotations low-value; the full scan runs on merge).
      # On workflow_dispatch, the `scanners` input gates execution.
      - name: Run Trivy
        id: trivy
        if: |
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.scanners == 'all' ||
            inputs.scanners == 'trivy'
          )
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          skip-dirs: .git,.cache
          exit-code: 0
          # cache-dir must be set in with: as well as env: — the action's
          # internal setup-trivy step reads the input to key actions/cache,
          # and ignores TRIVY_CACHE_DIR for that purpose.
          cache-dir: ${{ github.workspace }}/.cache/trivy

      - name: Convert Trivy results to SARIF
        if: always() && hashFiles('trivy-results.json') != ''
        run: |
          trivy convert \
            --format sarif \
            --output trivy-results.sarif \
            trivy-results.json

      - name: Upload Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Format Trivy summary
        if: always() && github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          trivy fs . \
            --scanners vuln \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --skip-dirs .git,.cache \
            --format table \
            --output trivy-table.txt \
            2>/dev/null || true

          TRIVY_BODY=$(cat trivy-table.txt 2>/dev/null || echo "No results.")

          DRY_NOTE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            DRY_NOTE="> ⚠️ **Dry run** — results are shown for visibility only. No PRs were opened."$'\n\n'
          fi

          cat <<COMMENT > vuln-summary.md
          ## 🛡️ Vulnerability Scan — $(date -u +"%Y-%m-%d %H:%M UTC")

          ${DRY_NOTE}
          <details><summary>Trivy CVE findings</summary>

          \`\`\`
          ${TRIVY_BODY}
          \`\`\`
          </details>
          COMMENT

      - name: Post vulnerability summary
        if: |
          always() &&
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.dry_run == false
          )
        run: cat vuln-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Block on CRITICAL/HIGH CVEs
        if: always()
        run: |
          if [ ! -f trivy-results.json ]; then exit 0; fi
          COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' trivy-results.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Trivy: $COUNT CRITICAL/HIGH CVE(s) found — see GitHub code scanning"
            exit 1
          fi

  # Resolve digest-pinned images to scan. Pushes and pull requests scan images
  # from changed Compose files for immediate feedback. Schedules and manual
  # Trivy runs scan the full inventory and are the only runs that publish SARIF:
  # GitHub treats each category as a complete snapshot, so a partial upload to a
  # shared bucket could incorrectly close alerts for images omitted from it.
  image-scan-plan:
    name: Plan Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      full_inventory: ${{ steps.plan.outputs.full_inventory }}
      gate_new: ${{ steps.plan.outputs.gate_new }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test security scan helpers
        run: >-
          python3 -m unittest discover
          --start-directory .github/scripts
          --pattern 'test_*.py'

      - name: Build image scan matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTED_SCANNERS: ${{ inputs.scanners }}
        run: |
          python3 .github/scripts/security_scan.py plan \
            --event "$EVENT_NAME" \
            --before "$BEFORE_SHA" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --scanners "${SELECTED_SCANNERS:-all}"

  image-vulnerabilities:
    name: Container Image Scan (${{ matrix.id }})
    needs: image-scan-plan
    if: |
      needs.image-scan-plan.outputs.count != '0' ||
      needs.image-scan-plan.outputs.full_inventory == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.image-scan-plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan images
        id: scan
        env:
          IMAGES: ${{ matrix.images }}
          BASELINE_IMAGES: ${{ matrix.baseline_images }}
        run: |
          mkdir -p trivy-image-results/current trivy-image-results/baseline
          ERRORS=0
          scan_images() {
            local group=$1
            local images=$2
            local index=0
            for image in $images; do
              index=$((index + 1))
              echo "Scanning $image"
              REPORT="trivy-image-results/${group}/image-${index}.sarif"
              if ! trivy image \
                --scanners vuln \
                --ignore-unfixed \
                --severity HIGH,CRITICAL \
                --format sarif \
                --output "$REPORT" \
                "$image"; then
                echo "::error::Trivy could not scan $image"
                ERRORS=$((ERRORS + 1))
              elif [ ! -s "$REPORT" ]; then
                echo "::error::Trivy did not produce SARIF for $image"
                ERRORS=$((ERRORS + 1))
              elif ! python3 .github/scripts/security_scan.py normalize-image-sarif \
                --input "$REPORT" \
                --output "$REPORT" \
                --image "$image"; then
                echo "::error::Could not normalize SARIF identity for $image"
                ERRORS=$((ERRORS + 1))
              fi
              if ! trivy clean --scan-cache; then
                echo "::warning::Trivy scan cache cleanup failed"
              fi
            done
          }
          scan_images current "$IMAGES"
          if [ "${{ needs.image-scan-plan.outputs.gate_new }}" = "true" ]; then
            scan_images baseline "$BASELINE_IMAGES"
          fi
          echo "errors=$ERRORS" >> "$GITHUB_OUTPUT"

      - name: Combine image scan results
        id: combine
        if: |
          always() &&
          steps.scan.outputs.errors == '0' && (
            needs.image-scan-plan.outputs.full_inventory == 'true' ||
             hashFiles('trivy-image-results/current/image-*.sarif') != ''
          )
        run: |
          python3 .github/scripts/security_scan.py combine \
            --pattern 'trivy-image-results/current/image-*.sarif' \
            --output trivy-image-results/combined.sarif

      - name: Compare changed images with trusted baseline
        id: gate
        if: |
          always() &&
          needs.image-scan-plan.outputs.gate_new == 'true' &&
          steps.scan.outputs.errors == '0' &&
          steps.combine.outcome == 'success'
        run: |
          python3 .github/scripts/security_scan.py combine \
            --pattern 'trivy-image-results/baseline/image-*.sarif' \
            --output trivy-image-results/baseline.sarif
          python3 .github/scripts/security_scan.py diff-sarif \
            --current trivy-image-results/combined.sarif \
            --baseline trivy-image-results/baseline.sarif \
            --output trivy-image-results/new.sarif

      - name: Summarize changed-image findings
        if: |
          always() &&
          needs.image-scan-plan.outputs.full_inventory != 'true' &&
          steps.combine.outcome == 'success'
        run: |
          COUNT=${{ steps.gate.outputs.count }}
          {
            echo "## Changed-image vulnerability scan"
            echo
            echo "Trivy found **${COUNT}** HIGH/CRITICAL result(s)."
            echo "The authoritative code-scanning baseline updates only after a complete scan."
            if [ "$COUNT" -gt 0 ]; then
              echo
              jq -r '
                [.runs[]?.results[]? |
                  {rule: .ruleId, detail: ((.message.text // "") | split("\n")[0])}] |
                unique_by([.rule, .detail]) | .[:50][] |
                "- **\(.rule)** — \(.detail)"
              ' trivy-image-results/new.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage complete bucket SARIF
        if: |
          always() &&
          needs.image-scan-plan.outputs.full_inventory == 'true' &&
          steps.scan.outputs.errors == '0' &&
          steps.combine.outcome == 'success' &&
          hashFiles('trivy-image-results/combined.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-results-${{ matrix.id }}
          path: trivy-image-results/combined.sarif
          if-no-files-found: error
          retention-days: 1

      - name: Fail on scanner errors
        if: always() && steps.scan.outputs.errors != '0'
        run: exit 1

      - name: Fail on newly introduced image vulnerabilities
        if: always() && steps.gate.outputs.count != '' && steps.gate.outputs.count != '0'
        run: |
          echo "::error::Trivy found ${{ steps.gate.outputs.count }} newly introduced HIGH/CRITICAL image vulnerability result(s)"
          exit 1

  # Publish only after every full-inventory bucket has scanned successfully.
  # This prevents any category from being replaced by an incomplete run when a
  # different matrix job fails later.
  image-vulnerability-publish:
    name: Publish Container Image Scan (${{ matrix.id }})
    needs: [image-scan-plan, image-vulnerabilities]
    if: |
      always() &&
      needs.image-scan-plan.result == 'success' &&
      needs.image-scan-plan.outputs.full_inventory == 'true' &&
      needs.image-vulnerabilities.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.image-scan-plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download complete bucket SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-image-results-${{ matrix.id }}
          path: trivy-image-results

      - name: Upload image results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-image-results/combined.sarif
          category: trivy-images-${{ matrix.id }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Per-finding suppression PRs
  #
  # Runs only from the protected default-branch schedule. Manual dispatches run
  # the read-only scanner jobs without granting repository write permissions.
  #
  # Suppressions are stored as one reviewed finding per .kics-exclude/ file.
  # ─────────────────────────────────────────────────────────────────────────
  fix-prs:
    name: Generate Fix PRs
    runs-on: ubuntu-latest
    # push is excluded: every merge to main previously triggered a full KICS
    # scan + PR manager run. Since most findings are already dismissed or have
    # an open PR, push runs were almost always no-ops and caused unnecessary
    # load. The protected weekly schedule is the only write-capable trigger.
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: security-scan-fix-prs
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate synchronized KICS pins
        run: python3 .github/scripts/security_scan.py verify-kics-pins

      - name: Checkout pinned KICS queries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Checkmarx/kics
          ref: e1f23cad9640f55b963f22a116b04906b8c16ac6 # v2.1.20
          path: .cache/kics-source

      - name: Install checksum-pinned KICS
        run: >-
          python3 .github/scripts/security_scan.py install-kics
          --destination "$RUNNER_TEMP/kics"

      # Full scan — not scoped to changed files; catches anything on main.
      # --exclude-severities medium,low,info — only open PRs for HIGH/CRITICAL.
      - name: Run KICS (full scan)
        run: |
          python3 .github/scripts/security_scan.py kics \
            --path . \
            --formats json \
            --output kics-results \
            --queries .cache/kics-source/assets/queries \
            --libraries .cache/kics-source/assets/libraries \
            --exclude-severities medium,low,info \
            --executable "$RUNNER_TEMP/kics"

      # One PR per finding. Closed-without-merge findings remain dismissed.
      # --pr-limit caps PRs opened per run.
      - name: Open per-finding suppression PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            --kics kics-results/results.json
            --repo "$REPOSITORY"
            --token "$GITHUB_TOKEN"
            --base main
            --pr-limit 20
          )
          python3 .github/scripts/kics-pr-manager.py "${args[@]}"

      - name: Clean up scan artifacts
        if: always()
        run: sudo rm -rf kics-results/

  notify:
    name: Notify
    needs:
      - misconfig
      - vulnerabilities
      - image-scan-plan
      - image-vulnerabilities
      - image-vulnerability-publish
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ping healthchecks
        env:
          HC_URL: ${{ secrets.HC_SECURITY_SCAN }}
        run: |
          [ -z "$HC_URL" ] && exit 0
          if [ "${{ needs.misconfig.result }}" = "success" ] && \
             [ "${{ needs.vulnerabilities.result }}" = "success" ] && \
             [ "${{ needs.image-scan-plan.result }}" = "success" ] && \
              { [ "${{ needs.image-vulnerabilities.result }}" = "success" ] || \
                [ "${{ needs.image-vulnerabilities.result }}" = "skipped" ]; } && \
              { [ "${{ needs.image-vulnerability-publish.result }}" = "success" ] || \
                [ "${{ needs.image-vulnerability-publish.result }}" = "skipped" ]; }; then
            curl -fsS --retry 3 "$HC_URL" > /dev/null || true
          else
            curl -fsS --retry 3 "${HC_URL}/fail" > /dev/null || true
          fi
