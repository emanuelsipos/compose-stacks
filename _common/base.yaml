---
services:
  x-runtime-defaults:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          pids: ${PIDS_LIMIT:-512}

  x-defaults:
    extends:
      service: x-runtime-defaults
    security_opt:
      - no-new-privileges:true

  x-postgres:
    extends:
      service: x-defaults
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  x-redis:
    extends:
      service: x-defaults
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5

  x-docker-socket-proxy:
    extends:
      service: x-defaults
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp

  x-byparr:
    extends:
      service: x-defaults
    image: ghcr.io/thephaseless/byparr:3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
    environment:
      - TZ=${TZ}
    expose:
      - '8191'
