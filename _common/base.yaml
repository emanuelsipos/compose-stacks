---
services:
  x-runtime-defaults:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          pids: ${PIDS_LIMIT:-512}

  x-defaults:
    extends:
      service: x-runtime-defaults
    security_opt:
      - no-new-privileges:true

  x-postgres:
    extends:
      service: x-defaults
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  x-redis:
    extends:
      service: x-defaults
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5

  x-docker-socket-proxy:
    extends:
      service: x-defaults
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp

  x-byparr:
    extends:
      service: x-defaults
    environment:
      - TZ=${TZ}
    tmpfs:
      - /tmp:size=2g,mode=1777
    expose:
      - '8191'
