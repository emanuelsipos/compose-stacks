---
services:
  addy:
    image: anonaddy/anonaddy:1.7.1@sha256:8307b2366af7fbe78dc4566fc912f7ef23b60baec6aaae1e842b86c8c1c0dc52
    container_name: addy
    depends_on:
      - db
      - valkey
    volumes:
      - /opt/docker/addy/addy/:/data/
      - /opt/docker/addy/dkim_signing.conf:/etc/rspamd/override.d/dkim_signing.conf
      # - /opt/docker/addy/greylist.conf:/etc/rspamd/override.d/greylist.conf
      - /opt/docker/addy/letsencrypt/certs/live/:/mnt/certs/live/:ro
      - /opt/docker/addy/letsencrypt/certs/archive/:/mnt/certs/archive/:ro
      # - /opt/docker/addy/fix-postfix.sh:/etc/cont-init.d/16-fix-postfix.sh:ro
    env_file: .env
    ports:
      - '25:25'
      # - "127.0.0.1:8000:8000"
    networks:
      ipv6_native:
        ipv6_address: ${ADDY_IPV6_ADDRESS:?Addy IPv6 address required}
      default:

    deploy:
      resources:
        limits:
          memory: ${ADDY_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
  certbot:
    image: certbot/dns-cloudflare:v5.8.0@sha256:c45edb002b883da1a1235abb205dff474a7a1a459d878e8d5fdc7f9d83073aea
    container_name: addy_certbot
    volumes:
      - /opt/docker/addy/letsencrypt/certs/:/etc/letsencrypt/
      - /opt/docker/addy/letsencrypt/cloudflare.ini:/cloudflare.ini:ro
      - ../../_common/certbot/komodo-deploy-hook.py:/usr/local/bin/komodo-deploy-hook:ro
      - /opt/docker/addy/letsencrypt/komodo-webhook.secret:/run/secrets/komodo-webhook:ro
    environment:
      CERT_CONSUMER_GID: "0"
      KOMODO_WEBHOOK_URL: ${ADDY_CERT_RELOAD_WEBHOOK_URL:?ADDY_CERT_RELOAD_WEBHOOK_URL required}
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/komodo-webhook
    command: >-
      certonly --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini --dns-cloudflare-propagation-seconds 60 --deploy-hook /usr/local/bin/komodo-deploy-hook -d ${ANONADDY_DOMAIN:?ANONADDY_DOMAIN required} -d *.${ANONADDY_DOMAIN:?ANONADDY_DOMAIN required} --agree-tos --non-interactive --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL required}
    restart: "no"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  cloudflare-ddns-real:
    image: favonia/cloudflare-ddns:1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
    container_name: addy_cloudflare-ddns-real
    environment:
      - PUID=1000
      - PGID=1000
      - CLOUDFLARE_API_TOKEN=${CF_API_TOKEN:?API token required}
      - DOMAINS=mail.${ANONADDY_DOMAIN}
      - PROXIED=false
      # - IP6_PROVIDER=none
    network_mode: "service:addy" # host
    cap_add:
      - SETUID
      - SETGID
    cap_drop:
      - all
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    read_only: true

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: addy_cloudflared
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?tunnel token required}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: addy_crowdsec
    depends_on:
      - docker-socket-proxy
    volumes:
      - /opt/docker/addy/crowdsec/:/etc/crowdsec/
      - /opt/docker/addy/crowdsec/db/:/var/lib/crowdsec/data/
    environment:
      COLLECTIONS: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/postfix crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors
      ENROLL_INSTANCE_NAME: addy
      ENROLL_TAGS: docker
      GID: "1000"
      PARSERS: crowdsecurity/whitelists
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports:
      - '127.0.0.1:6060:6060'
      - '127.0.0.1:8080:8080'
    networks:
      default:
      socket_proxy:
    command: -t
    healthcheck:
      test:
        - CMD
        - cscli
        - lapi
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  db:
    image: mariadb:10@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
    container_name: addy_db
    volumes:
      - /opt/docker/addy/db/:/var/lib/mysql/
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?database name required}
      MYSQL_USER: ${DB_USERNAME:?database user required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?database password required}
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    deploy:
      resources:
        limits:
          memory: ${ADDY_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  db-backup:
    image: tiredofit/db-backup:4.1.100@sha256:78e3cb669ee9648c1a4ab7e8421c6e89d01b659bfa5963f7611a2347b2009eab
    depends_on:
      - db
    volumes:
      - /opt/docker/addy/backup/:/backup/
    environment:
      DB01_TYPE: mysql
      DB01_HOST: ${DB_HOST}
      DB01_NAME: ${DB_DATABASE:?database name required}
      DB01_USER: ${DB_USERNAME:?database user required}
      DB01_PASS: ${DB_PASSWORD:?database password required}
      CONTAINER_ENABLE_MONITORING: FALSE
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  docker-socket-proxy:
    container_name: addy_docker-socket-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      POST: 0
    networks:
      - socket_proxy
    extends:
      file: ../../_common/base.yaml
      service: x-docker-socket-proxy

  nginx:
    image: nginx:1.31.5@sha256:05b8cb60c354a44ab824ea6e7dc69b46d50762cdbe728a347a5b656e6fb3d7c4
    container_name: addy_nginx
    depends_on:
      - addy
    volumes:
      - /opt/docker/addy/nginx/conf.d/:/etc/nginx/conf.d/:ro
      - /opt/docker/addy/nginx/ssl/:/etc/nginx/ssl/:ro
      - /opt/docker/addy/letsencrypt/certs/live/:/etc/letsencrypt/live/:ro
      - /opt/docker/addy/letsencrypt/certs/archive/:/etc/letsencrypt/archive/:ro
      - /opt/docker/addy/letsencrypt/www/:/var/www/:ro
    deploy:
      resources:
        limits:
          memory: ${ADDY_NGINX_MEM_LIMIT:-256m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
  valkey:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: addy_valkey
    deploy:
      resources:
        limits:
          memory: ${ADDY_VALKEY_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-redis

networks:
  ipv6_native:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: "routed"
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${ADDY_IPV6_SUBNET:?Addy IPv6 subnet required}
          gateway: ${ADDY_IPV6_GATEWAY:?Addy IPv6 gateway required}
  socket_proxy:
    driver: bridge
    internal: true
