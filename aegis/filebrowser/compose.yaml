---
services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    volumes:
      - /opt/docker/filebrowser/config/:/config/
      - /opt/docker/filebrowser/database/:/database/
      - /:/srv/
    # env_file: .env
    ports:
      - '${TAILSCALE_IP}:8080:80'
    user: 0:0
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
