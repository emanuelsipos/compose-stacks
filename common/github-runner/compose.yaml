---
services:
  worker:
    image: myoung34/github-runner:2.338.0-ubuntu-noble@sha256:2112bde2ee92b7480babfbe3043d0461e322b97ca01e6ac94698895f3dc1f528
    environment:
      REPO_URL: https://github.com/example/repo
      RUNNER_NAME_PREFIX: archon-runner
      APP_ID: ${APP_ID:?app ID required}
      APP_PRIVATE_KEY: ${APP_PRIVATE_KEY:?app private key required}
      RUNNER_SCOPE: "org"
      ORG_NAME: ${ORG_NAME}
      LABELS: linux,arm64
      EPHEMERAL: 1
      RUN_AS_ROOT: false
      RUNNER_WORKDIR: /home/runner/_work
      UNSET_CONFIG_VARS: true
      START_DOCKER_SERVICE: true
    cpu_shares: 128
    deploy:
      replicas: ${RUNNER_REPLICAS}
      resources:
        limits:
          pids: ${RUNNER_PIDS_LIMIT:-2048}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    # Required for Docker-in-Docker (DinD): runner builds CI container images
    # inside the container. Mitigations: ephemeral runners (EPHEMERAL: 1),
    # tmpfs-only working state, org-scoped token (not repo-scoped PAT).
    privileged: true
    tmpfs:
      - /var/lib/docker:exec,mode=711
      - /var/run:exec,mode=711
      - /home/runner/_work:exec,mode=711
