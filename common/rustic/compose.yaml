---
services:
  rustic:
    image: ghcr.io/rustic-rs/rustic:v0.12.0@sha256:b357591d911ec72f14a8d9cf1382da4371f3c5829eb2075e23b27f1b6702c59f
    container_name: rustic
    volumes:
      - /opt/docker/rustic/config/:/.config/rustic/:ro
      - /opt/docker/rustic/cache/:/.cache/rustic/
      - /opt/docker/rustic/curl:/curl
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /opt/:/backup/opt/:ro
      - /root/:/backup/root/:ro
      - /home/:/backup/home/:ro
    env_file: .env
    command: backup
    restart: "no"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
