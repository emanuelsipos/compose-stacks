---
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.7@sha256:5c1276a655498fb9774e22e42ceeb5279eb2d7c46e3c209ce8285a7b0bae4925
    container_name: syncthing-${HOSTNAME}
    volumes:
      - /opt/docker/syncthing-${HOSTNAME}/:/config/
      - ${SYNC_PATH}:${SYNC_PATH}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    hostname: ${HOSTNAME}
