---
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.5@sha256:455bb8427106eb8522f9133a43d4e6ca799d4983c1b53e77a2bc6f7290855483
    container_name: syncthing-${HOSTNAME}
    volumes:
      - /opt/docker/syncthing-${HOSTNAME}/:/config/
      - ${SYNC_PATH}:${SYNC_PATH}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    hostname: ${HOSTNAME}
