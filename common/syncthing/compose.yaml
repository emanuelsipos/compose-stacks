---
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.6@sha256:122a5e733332c20bfd516d88cd38d7d973c3dad52c52a389d992651acc074df5
    container_name: syncthing-${HOSTNAME}
    volumes:
      - /opt/docker/syncthing-${HOSTNAME}/:/config/
      - ${SYNC_PATH}:${SYNC_PATH}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    hostname: ${HOSTNAME}
