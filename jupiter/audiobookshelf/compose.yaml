---
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0@sha256:180acad33d69c99ed208676465d8edcb268fa46967735579a7810859885b1a8e
    volumes:
      - /mnt/data2/media/audiobooks/:/audiobooks/
      - /mnt/data2/media/podcasts/:/podcasts/
      - /opt/docker/audiobookshelf/config/:/config/
      - /opt/docker/audiobookshelf/metadata/:/metadata/
    ports:
      - '13378:80'
    user: 1000:1000
    deploy:
      resources:
        limits:
          memory: ${AUDIOBOOKSHELF_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
