---
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
    volumes:
      - /mnt/data2/media/audiobooks/:/audiobooks/
      - /mnt/data2/media/ebooks/:/ebooks/
      - /mnt/data2/media/podcasts/:/podcasts/
      - /opt/docker/audiobookshelf/config/:/config/
      - /opt/docker/audiobookshelf/metadata/:/metadata/
    ports:
      - '13378:80'
    user: 1000:1000
    deploy:
      resources:
        limits:
          memory: ${AUDIOBOOKSHELF_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
