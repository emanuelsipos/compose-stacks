---
x-bazarr-base: &bazarr-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: lscr.io/linuxserver/bazarr:1.6.0@sha256:ac284d3fda9ee7da8b15197dc51f0d7a2a1da98549bee99a3d924d3e94a5e7ed
  env_file: .env
  healthcheck:
    test: [ "CMD-SHELL", "curl -fSs http://localhost:6767/ || exit 1" ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

x-git-updater: &git-updater
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: alpine/git:v2.54.0@sha256:6f8eae2205a85c51106a9650e574a37fb1d5e4f645e5f6ea57cb57b9462cd4cf
  command:
    - "-c"
    - |
      echo "Starting Git Auto-Updater..."
      while true; do
        echo "[ $$(date) ] Scanning for git repositories..."

        # Record a successful pass only when every discovered repository updates.
        find /git -type d -name ".git" | {
          found=false
          failed=false
          while IFS= read -r gitdir; do
            found=true
            repo_dir=$$(dirname "$$gitdir")
            echo "--> Pulling updates for $$repo_dir"
            git -C "$$repo_dir" pull --ff-only || failed=true
          done
          if [ "$$found" = false ]; then
            echo "No git repositories found under /git" >&2
          elif [ "$$failed" = false ]; then
            date +%s > /tmp/git-updater.last-success
          fi
        }

        echo "Update pass finished. Sleeping for 1 hour..."
        sleep 3600
      done
  entrypoint: /bin/sh
  user: ${PUID}:${PGID}
  healthcheck:
    test: [ "CMD-SHELL", "test -s /tmp/git-updater.last-success && test $$(( $$(date +%s) - $$(cat /tmp/git-updater.last-success) )) -lt 7200" ]
    interval: 5m
    timeout: 10s
    retries: 1
    start_period: 5m
x-vol-media: &vol-media /mnt/data/media/:/data/media/
x-vol-subcleaner: &vol-subcleaner /opt/docker/git/subcleaner/:/opt/subcleaner/

services:
  bazarr-anime:
    container_name: bazarr-anime
    volumes:
      - *vol-subcleaner
      - *vol-media
      - /opt/docker/bazarr-anime/:/config
    ports:
      - '6767:6767'
    <<: *bazarr-base

  bazarr-tv:
    container_name: bazarr-tv
    volumes:
      - *vol-subcleaner
      - *vol-media
      - /opt/docker/bazarr-tv/:/config/
    ports:
      - '6768:6767'
    <<: *bazarr-base

  bazarr-tv-4k:
    container_name: bazarr-tv-4k
    volumes:
      - *vol-subcleaner
      - *vol-media
      - /opt/docker/bazarr-tv-4k/:/config/
    ports:
      - '6769:6767'
    <<: *bazarr-base

  git-updater:
    container_name: git-auto-updater
    volumes:
      - /opt/docker/git/:/git/
    <<: *git-updater
