---
services:
  browser-sockpuppet-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2
    container_name: browser-sockpuppet-chrome
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=2
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    tmpfs:
      - /tmp:size=2g,mode=1777
    ulimits:
      core:
        soft: 0
        hard: 0

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.1@sha256:72e761d84463553c4a276127df46a4967e9feea8878b88b05d8c058ddbe1a4c8
    container_name: changedetection
    depends_on:
      - browser-sockpuppet-chrome
    volumes:
      - /opt/docker/changedetection/:/datastore/
    environment:
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
      - FETCH_WORKERS=2
    env_file: .env
    ports:
      - '5000:5000'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  flareproxy:
    image: mickey3721/flareproxy:latest@sha256:5d6b4ea0c6b9024a6de9933e18fe068f2a92504e5a41d3212036cf519885bbc3
    container_name: flareproxy
    depends_on:
      flaresolverr:
        condition: service_started
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - TZ=${TZ}
    expose:
      - '8080'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.1.1@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
    extends:
      file: ../../_common/base.yaml
      service: x-byparr
