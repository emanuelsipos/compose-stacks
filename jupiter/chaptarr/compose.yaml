---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:5d287ede0df43f7f448b7e56f8c4f6a79197318b15d90254a9d6a85eb7686fb0
    container_name: chaptarr_postgres
    volumes:
      - /opt/docker/chaptarr/db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-chaptarr}
      POSTGRES_DB: ${PG_DB:-chaptarr-main}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.chaptarr:
    image: robertlordhood/chaptarr:0.9.925@sha256:8e29f4941acaf74c80bba4322237dfd2549816b3dd1b581f176b1be5d1ccb46b
    container_name: chaptarr
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/chaptarr/config/:/config/
      - /mnt/data2/:/data2/ # :ro
    environment:
      Chaptarr__Postgres__Host: database.postgres
      Chaptarr__Postgres__Port: 5432
      Chaptarr__Postgres__User: ${PG_USER:-chaptarr}
      Chaptarr__Postgres__Password: ${PG_PASS}
      Chaptarr__Postgres__MainDb: ${PG_DB:-chaptarr-main}
      Chaptarr__Postgres__LogDb: chaptarr-log
      Chaptarr__Postgres__CacheDb: chaptarr-cache
    env_file: .env
    ports:
      - '8789:8789'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
