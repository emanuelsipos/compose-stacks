---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:67923199b98fc6d69693a21a5a134e179bf1e2bfafdbad1445d7688b389ca11d
    container_name: forgejo_postgres
    volumes:
      - /opt/docker/forgejo/server/db/:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${DB_BASE:-forgejo}
      POSTGRES_USER: ${DB_USER:-forgejo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?database password required}
    networks:
      - database_only
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.docker-in-docker:
    image: data.forgejo.org/oci/docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
    container_name: docker-in-docker
    volumes:
      - /opt/docker/forgejo/docker_certs/:/certs/
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_HOST: docker-in-docker
    networks:
      - public_access
      - service_only
    healthcheck:
      test: [ "CMD", "docker", "-H", "unix:///var/run/docker.sock", "info" ]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_DIND_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    hostname: docker # Must set hostname as TLS certificates are only valid for docker or localhost
    # Required for Docker-in-Docker (DinD): Forgejo Actions runner connects via
    # TLS-secured TCP socket (DOCKER_HOST=tcp://docker:2376, DOCKER_TLS_VERIFY=1).
    privileged: true

  service.forgejo:
    image: data.forgejo.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
    container_name: forgejo
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/forgejo/server/data/:/var/lib/gitea/
      - /opt/docker/forgejo/server/config/:/etc/gitea/
    environment:
      USER_UID: 65531
      USER_GID: 65531
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: database.postgres:5432
      FORGEJO__database__NAME: ${DB_BASE:-forgejo}
      FORGEJO__database__USER: ${DB_USER:-forgejo}
      FORGEJO__database__PASSWD: ${DB_PASSWORD:?database password required}
    env_file: .env
    ports:
      - '3000:3000'
      # - '2222:2222'
    networks:
      - public_access
      - service_only
      - database_only
    user: 65531:65531
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  service.runner-daemon:
    image: data.forgejo.org/forgejo/runner:13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22
    container_name: forgejo-runner
    depends_on:
      service.docker-in-docker:
        condition: service_healthy
    volumes:
      - /opt/docker/forgejo/runner-data/:/data/
      - /opt/docker/forgejo/docker_certs/:/certs/
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    networks:
      - public_access
      - service_only
    command: >-
      bash -c ' while : ; do test -w .runner && forgejo-runner --config config.yml daemon ; sleep 1 ; done '
    user: 65530:65530
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_RUNNER_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  public_access:
  service_only:
    internal: true
  database_only:
    internal: true
