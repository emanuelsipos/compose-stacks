---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:5d287ede0df43f7f448b7e56f8c4f6a79197318b15d90254a9d6a85eb7686fb0
    container_name: forgejo_postgres
    volumes:
      - /opt/docker/forgejo/server/db/:/var/lib/postgresql/
    environment:
      POSTGRES_DB: ${DB_BASE:-forgejo}
      POSTGRES_USER: ${DB_USER:-forgejo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?database password required}
    networks:
      - database_only
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.docker-in-docker:
    image: data.forgejo.org/oci/docker:29-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
    container_name: docker-in-docker
    volumes:
      - /opt/docker/forgejo/docker_certs/:/certs/
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_HOST: docker-in-docker
    networks:
      - public_access
      - service_only
    healthcheck:
      test: [ "CMD", "docker", "-H", "unix:///var/run/docker.sock", "info" ]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_DIND_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    hostname: docker # Must set hostname as TLS certificates are only valid for docker or localhost
    # Required for Docker-in-Docker (DinD): Forgejo Actions runner connects via
    # TLS-secured TCP socket (DOCKER_HOST=tcp://docker:2376, DOCKER_TLS_VERIFY=1).
    privileged: true

  service.forgejo:
    image: data.forgejo.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
    container_name: forgejo
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/forgejo/server/data/:/var/lib/gitea/
      - /opt/docker/forgejo/server/config/:/etc/gitea/
    environment:
      USER_UID: 65531
      USER_GID: 65531
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: database.postgres:5432
      FORGEJO__database__NAME: ${DB_BASE:-forgejo}
      FORGEJO__database__USER: ${DB_USER:-forgejo}
      FORGEJO__database__PASSWD: ${DB_PASSWORD:?database password required}
    env_file: .env
    ports:
      - '3000:3000'
      # - '2222:2222'
    networks:
      - public_access
      - service_only
      - database_only
    user: 65531:65531
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  service.runner-daemon:
    image: data.forgejo.org/forgejo/runner:13.0.0@sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2
    container_name: forgejo-runner
    depends_on:
      service.docker-in-docker:
        condition: service_healthy
    volumes:
      - /opt/docker/forgejo/runner-data/:/data/
      - /opt/docker/forgejo/docker_certs/:/certs/
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    networks:
      - public_access
      - service_only
    command: >-
      bash -c ' while : ; do test -w .runner && forgejo-runner --config config.yml daemon ; sleep 1 ; done '
    user: 65530:65530
    deploy:
      resources:
        limits:
          memory: ${FORGEJO_RUNNER_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  public_access:
  service_only:
    internal: true
  database_only:
    internal: true
