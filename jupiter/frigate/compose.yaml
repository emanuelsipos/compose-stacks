---
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35
    container_name: frigate
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /opt/docker/frigate/:/config/
      - type: bind
        source: /mnt/appdata/frigate/media
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    env_file: .env
    ports:
      # - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - '8554:8554' # RTSP feeds
      - '8555:8555/tcp' # WebRTC over tcp
      - '8555:8555/udp' # WebRTC over udp
      - '8971:8971'
    deploy:
      resources:
        limits:
          memory: ${FRIGATE_MEM_LIMIT:-4g}
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    # privileged: true # this may not be necessary for all setups
    # cap_add:
    #   - CAP_PERFMON
    shm_size: "512mb" # update for your cameras based on calculation above
    stop_grace_period: 30s # allow enough time to shut down the various services
