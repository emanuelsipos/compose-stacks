---
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e
    container_name: homeassistant
    volumes:
      - /opt/docker/home-assistant/:/config/
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus/:/run/dbus/:ro
    network_mode: host
    deploy:
      resources:
        limits:
          memory: ${HOMEASSISTANT_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:8.1.2@sha256:6827e352011e2d8c2bde771e446fcf72acc49150ef66bad978816bac1762aad3
    container_name: matter-server
    volumes:
      - /opt/docker/matter-server/:/data/
      # - /run/dbus:/run/dbus:ro # Required for Bluetooth via D-Bus
    network_mode: host
    deploy:
      resources:
        limits:
          memory: ${MATTER_SERVER_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
