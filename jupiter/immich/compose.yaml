---
services:
  database:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
    container_name: immich_postgres
    volumes:
      - /opt/docker/immich/postgres/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?database password required}
      POSTGRES_USER: ${DB_USERNAME:?database user required}
      POSTGRES_DB: ${DB_DATABASE_NAME:?database name required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    deploy:
      resources:
        limits:
          memory: ${IMMICH_DATABASE_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    shm_size: 128mb

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.1-openvino@sha256:0f8a5a4ee83989cbfffc69d0d81c4714894f5dc27bbb75cbe3ee31a73353557d
    container_name: immich_machine_learning
    volumes:
      - model-cache:/cache/
      - /dev/bus/usb/:/dev/bus/usb/
    env_file:
      - .env
    healthcheck:
      disable: false
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yaml
    #   service: openvino # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    deploy:
      resources:
        limits:
          memory: ${IMMICH_ML_MEM_LIMIT:-6g}
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    group_add:
      - 44
      - 104

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.1@sha256:2ab6a6273755d9b8a5c4f25dbaa2d097fc4a2cc261b70bc73621e6405cc106fe
    container_name: immich_server
    depends_on:
      - database
      - redis
    volumes:
      - /photos/:/usr/src/app/upload/
      - type: bind
        source: /mnt/userdata/photos
        target: /usr/src/app/upload/library
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    healthcheck:
      disable: false
    user: "${PUID:-1000}:${PGID:-1000}"
    deploy:
      resources:
        limits:
          memory: ${IMMICH_SERVER_MEM_LIMIT:-3g}
    # extends:
    #   file: hwaccel.transcoding.yaml
    #   service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    group_add:
      - 44
      - 104

  redis:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: immich_redis
    extends:
      file: ../../_common/base.yaml
      service: x-redis

volumes:
  model-cache:
