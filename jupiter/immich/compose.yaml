---
services:
  database:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1@sha256:828081a755d3911a2d94f0a2be9f98570c07d52cf080fd310a9d6e4b83b73aa5
    container_name: immich_postgres
    volumes:
      - /opt/docker/immich/postgres/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    shm_size: 128mb

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0-openvino@sha256:4b6ef958e7749fc548377bb23ee219c09c74da8decee080d76dc6a388c39b013
    container_name: immich_machine_learning
    volumes:
      - model-cache:/cache/
      - /dev/bus/usb/:/dev/bus/usb/
    env_file:
      - .env
    healthcheck:
      disable: false
    device_cgroup_rules:
      - "c 189:* rmw"
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yaml
    #   service: openvino # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    group_add:
      - 44
      - 104

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich_server
    depends_on:
      - database
      - redis
    volumes:
      - /photos/:/usr/src/app/upload/
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    healthcheck:
      disable: false
    user: "${PUID:-1000}:${PGID:-1000}"
    # extends:
    #   file: hwaccel.transcoding.yaml
    #   service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    group_add:
      - 44
      - 104

  redis:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: immich_redis
    extends:
      file: ../../_common/base.yaml
      service: x-redis

volumes:
  model-cache:
