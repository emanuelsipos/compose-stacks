---
services:
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_CHROME_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true

  meilisearch:
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    volumes:
      - /opt/docker/karakeep/meilisearch/:/meili_data/
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?master key required}
      MEILI_NO_ANALYTICS: "true"
      MEILI_UPGRADE_DB: "true"
    user: 1000:1000
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_MEILISEARCH_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  web:
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
    volumes:
      - /opt/docker/karakeep/data/:/data/
      - type: bind
        source: /mnt/appdata/karakeep/assets
        target: /assets
        bind:
          create_host_path: false
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data # DON'T CHANGE THIS
    env_file: .env
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
