---
services:
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.78-r1@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_CHROME_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true

  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    volumes:
      - /opt/docker/karakeep/meilisearch/:/meili_data/
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?master key required}
      MEILI_NO_ANALYTICS: "true"
      MEILI_UPGRADE_DB: "true"
    user: 1000:1000
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_MEILISEARCH_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  web:
    image: ghcr.io/karakeep-app/karakeep:0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
    volumes:
      - /opt/docker/karakeep/data/:/data/
      - type: bind
        source: /mnt/appdata/karakeep/assets
        target: /assets
        bind:
          create_host_path: false
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data # DON'T CHANGE THIS
    env_file: .env
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          memory: ${KARAKEEP_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
