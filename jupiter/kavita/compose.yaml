---
services:
  kavita:
    image: lscr.io/linuxserver/kavita:0.9.0@sha256:e8bb2c61e8669a557d53a9fe2ae72393df29308c1134b68bf13f5697d1801e24
    container_name: kavita
    volumes:
      - /opt/docker/kavita/:/config/
      - /mnt/data3/media/:/data3/media/
      - /mnt/data3/torrents/:/data3/torrents/
      - /mnt/data2/torrents/manga/:/data2/torrents/manga/
    env_file: .env
    ports:
      - '5000:5000'
    deploy:
      resources:
        limits:
          memory: ${KAVITA_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
