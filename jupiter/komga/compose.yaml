---
x-komga-base: &komga-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: gotson/komga:1.29.0@sha256:c9ad2e0a0efdbb60a79b990836bd2b3d48b1f47677d2e5008579daa10a85e8e8
  env_file: .env
  user: "${PUID:-1000}:${PGID:-1000}"
x-vol-media: &vol-media /mnt/data3/media/:/data3/media/
x-vol-torrents: &vol-torrents /mnt/data3/torrents/:/data3/torrents/

services:
  komga:
    container_name: komga
    volumes:
      - *vol-media
      - *vol-torrents
      - /opt/docker/komga/:/config/
      - /mnt/data2/torrents/manga/:/data2/torrents/manga/
    environment:
      - MALLOC_ARENA_MAX=2
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms1g -Xmx6g -XX:MaxDirectMemorySize=2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+ExitOnOutOfMemoryError
    ports:
      - '25600:25600'
    <<: *komga-base
    deploy:
      resources:
        limits:
          memory: 10g

  komga2:
    container_name: komga2
    volumes:
      - *vol-media
      - *vol-torrents
      - /opt/docker/komga2/:/config/
    environment:
      - MALLOC_ARENA_MAX=2
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms512m -Xmx3g -XX:MaxDirectMemorySize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication
    ports:
      - '25601:25600'
    <<: *komga-base
    deploy:
      resources:
        limits:
          memory: 4g
