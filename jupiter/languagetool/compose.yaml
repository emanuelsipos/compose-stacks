---
services:
  languagetool:
    image: erikvl87/languagetool@sha256:4010609d184061db012accb65526349cddc7c15166c150b8b6bf69e465ffd731
    container_name: languagetool
    volumes:
      - type: bind
        source: /mnt/appdata/languagetool/ngrams
        target: /ngrams
        read_only: true
        bind:
          create_host_path: false
      # - /opt/docker/languagetool/logback.xml:/LanguageTool/logback.xml:ro
    env_file: .env
    ports:
      - '8010:8010'
    deploy:
      resources:
        limits:
          memory: ${LANGUAGETOOL_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
