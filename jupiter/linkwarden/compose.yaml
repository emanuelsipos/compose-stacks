---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:5d287ede0df43f7f448b7e56f8c4f6a79197318b15d90254a9d6a85eb7686fb0
    container_name: linkwarden_postgres
    volumes:
      - /opt/docker/linkwarden/pgdata/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_DB: ${PG_DB:-postgres}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.16.0@sha256:d805877fb707d160b809027c302f84cfba11a248d7fdc12de90b4791f98e6b55
    container_name: linkwarden
    depends_on:
      database.postgres:
        condition: service_healthy
      service.meilisearch:
        condition: service_started
    volumes:
      - /linkwarden/:/data/data/
    environment:
      - DATABASE_URL=postgresql://${PG_USER:-postgres}:${PG_PASS:?database password required}@database.postgres:5432/${PG_DB:-postgres}
    env_file: .env
    ports:
      - '3000:3000'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  service.meilisearch:
    image: getmeili/meilisearch:v1.52.0@sha256:d36e713e8f89483af1ab0d72011bbd503f5ab100b68ccbfad51c39e3f0a0567d
    container_name: meilisearch
    volumes:
      - /opt/docker/linkwarden/meilisearch/:/meili_data/
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?master key required}
      MEILI_NO_ANALYTICS: "true"
      MEILI_UPGRADE_DB: "true"
    user: 1000:1000
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
