---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.14@sha256:47f86fe9ae00f53393b63d267b9cb671a101b0a2082de8a4b27cf44232729508
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
