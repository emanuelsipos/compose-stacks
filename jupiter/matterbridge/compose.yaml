---
services:
  matterbridge:
    image: luligu/matterbridge:3.11.1@sha256:bb83780384dfcb311bcd529a2e7b0279784f1422e37f66b94a83d8265060402c
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
