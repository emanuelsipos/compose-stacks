---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.11@sha256:e278cf685f91d6953fb74ed13b7013b514d1417975cf1846599c780bcf551420
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
