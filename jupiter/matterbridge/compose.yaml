---
services:
  matterbridge:
    image: luligu/matterbridge:3.11.2@sha256:96b6f8204bec75cade48d6e04f58113fdfefcaa4b6a566990976673849f9965e
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
