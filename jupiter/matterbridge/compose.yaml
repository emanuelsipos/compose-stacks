---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.13@sha256:56bf894ad9f80cd660bc55b79efe52eaaa8fc93d1cff28b6db9e26ce21671699
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
