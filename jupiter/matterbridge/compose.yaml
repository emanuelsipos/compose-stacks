---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.9@sha256:c01108d904ecb908fcf0c7a42debf3fc071dbede4997b5bdef9cee5631a2427a
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
