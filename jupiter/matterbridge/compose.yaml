---
services:
  matterbridge:
    image: luligu/matterbridge:3.11.3@sha256:93810dd63b0b83c46d1a8c150c4a8ca4796030ca84ff4974afbfedbac889f512
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
