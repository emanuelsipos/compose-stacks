---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.10@sha256:5027ca26d72da218148539066d9fc4f03622c25da1717ce357e33bda26e7cf18
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
