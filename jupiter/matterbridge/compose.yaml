---
services:
  matterbridge:
    image: luligu/matterbridge:3.11.4@sha256:c4690d9badbd63782833233ddcaf63b470ede628488ebd8fabd29c92e763a2c4
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
