---
services:
  matterbridge:
    image: luligu/matterbridge:3.11.0@sha256:03f860bf7d27dbe2272f2c6002f3290f8e36cc2d335216501361a61733e1b7c2
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
