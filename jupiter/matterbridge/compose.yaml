---
services:
  matterbridge:
    image: luligu/matterbridge:3.10.4@sha256:9d51990bf548e6e42a8a31fe86b6f677ffcab2f615422652551169d50182b02c
    container_name: matterbridge
    volumes:
      - /opt/docker/matterbridge/Matterbridge/:/root/Matterbridge/
      - /opt/docker/matterbridge/.matterbridge/:/root/.matterbridge/
      - /opt/docker/matterbridge/.mattercert/:/root/.mattercert/
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
