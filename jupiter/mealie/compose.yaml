---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:e9fe125da1a03f89e3ff1d9d5a0e317ac03943bb43fb1ba4bc63135094d262c1
    container_name: mealie_postgres
    volumes:
      - /opt/docker/mealie/database/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
    deploy:
      resources:
        limits:
          memory: ${MEALIE_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
    container_name: mealie
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/mealie/data/:/app/data/
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: database.postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
    env_file: .env
    ports:
      - '9925:9000'
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/api/app/about" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${MEALIE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
