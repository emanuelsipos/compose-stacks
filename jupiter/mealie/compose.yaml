---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:722599f0fe6483f2a97e765066e23122a780b4ea221287edfaaf67268af6757a
    container_name: mealie_postgres
    volumes:
      - /opt/docker/mealie/database/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
    deploy:
      resources:
        limits:
          memory: ${MEALIE_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    container_name: mealie
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/mealie/data/:/app/data/
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: database.postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mealie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
      POSTGRES_DB: ${POSTGRES_DB:-mealie}
    env_file: .env
    ports:
      - '9925:9000'
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:9000/api/app/about" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${MEALIE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
