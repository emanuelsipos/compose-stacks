---
services:
  music-assistant-server:
    image: ghcr.io/music-assistant/server:2.10.4@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
    container_name: music-assistant-server
    volumes:
      - /opt/docker/music-assistant-server/:/data/
    env_file: .env
    network_mode: host # Network mode must be set to host for MA to work correctly
    user: 1000:1000
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
