---
services:
  omada-controller:
    image: mbentley/omada-controller:6.2.14.11@sha256:22336d9324dcbb67c9f8b1222c312bca2b167e16bf8e90f8bdf3c3fa1148c031
    container_name: omada-controller
    volumes:
      - /opt/docker/omada/data/:/opt/tplink/EAPController/data/
      - /opt/docker/omada/logs/:/opt/tplink/EAPController/logs/
    env_file: .env
    ports:
      - '8043:8043'
      - '8088:8088'
      - '8843:8843'
      - '19810:19810/udp'
      - '27001:27001/udp'
      - '29810:29810/udp'
      - '29811-29817:29811-29817'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
