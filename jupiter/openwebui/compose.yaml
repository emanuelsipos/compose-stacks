---
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main@sha256:d6c085678f7e3f474aa2a92ac9831cb68759dcfd951de250ebbb37dac5cd0255
    container_name: openwebui
    volumes:
      - /opt/docker/open-webui/:/app/backend/data/
    env_file: .env
    ports:
      - '3000:8080'
    deploy:
      resources:
        limits:
          memory: ${OPENWEBUI_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
