---
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main@sha256:59b912d4246103c7285de0e9a5f2f6586614c06b4c4e46edc51a8f29e7b099a5
    container_name: openwebui
    volumes:
      - /opt/docker/open-webui/:/app/backend/data/
    env_file: .env
    ports:
      - '3000:8080'
    deploy:
      resources:
        limits:
          memory: ${OPENWEBUI_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
