---
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main@sha256:07868b11646575a4d6d6baeaf312692f672c11e21002590db2f7bfe0e64d7e28
    container_name: openwebui
    volumes:
      - /opt/docker/open-webui/:/app/backend/data/
    env_file: .env
    ports:
      - '3000:8080'
    deploy:
      resources:
        limits:
          memory: ${OPENWEBUI_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
