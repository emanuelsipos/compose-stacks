  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    container_name: traefik
    depends_on:
      pangolin:
        condition: service_healthy
        restart: true
    volumes:
      - /opt/docker/pangolin/traefik/:/etc/traefik/:ro
      - /opt/docker/pangolin/letsencrypt/:/letsencrypt/
      - /opt/docker/pangolin/traefik/logs/:/var/log/traefik/
    env_file: .env
    # network_mode: service:gerbil
    ports:
      - '80:80'
      - '443:443'
      - '6697:6697/tcp'
      - '6697:6697/udp'
      - '8883:8883/tcp'
    networks:
      default:
        ipv4_address: ${PANGOLIN_GATEWAY_IP:-172.20.0.251}
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  default:
    driver: bridge
    name: pangolin
    ipam:
      config:
        - subnet: 172.20.0.0/24
