---
x-profilarr-base: &profilarr-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: ghcr.io/dictionarry-hub/profilarr:2.3.1@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
  env_file: .env
  environment: &profilarr-env
    PARSER_HOST: parser
    PARSER_PORT: 5000
  depends_on:
    parser:
      condition: service_healthy
  init: true

services:
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1@sha256:234084df7037e76b98c66f5ab220dc0d10ef8f34145ded57b9af257f057bdda6
    container_name: profilarr-parser
    expose:
      - '5000'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true

  profilarr-anime:
    container_name: profilarr-anime
    volumes:
      - /opt/docker/profilarr-anime/:/config/
    environment:
      <<: *profilarr-env
      ORIGIN: https://profilarr-anime.${PUBLIC_DOMAIN}
    ports:
      - '6868:6868'
    <<: *profilarr-base

  profilarr-tv:
    container_name: profilarr-tv
    volumes:
      - /opt/docker/profilarr-tv/:/config/
    environment:
      <<: *profilarr-env
      ORIGIN: https://profilarr-tv.${PUBLIC_DOMAIN}
    ports:
      - '6869:6868'
    <<: *profilarr-base
