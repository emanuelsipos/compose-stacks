---
x-profilarr-base: &profilarr-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: ghcr.io/dictionarry-hub/profilarr:2.2.0@sha256:ddcdd0f340043c2ec0a85ca74b9a6be9be42b1c0288c75fc36a26a43f695860b
  env_file: .env
  environment: &profilarr-env
    PARSER_HOST: parser
    PARSER_PORT: 5000
  depends_on:
    parser:
      condition: service_healthy
  init: true

services:
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.2.0@sha256:3cd3f8c4979ee66304a518462cc6c5b59825bae6b25e7dfa51b30178b9265df7
    container_name: profilarr-parser
    expose:
      - '5000'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true

  profilarr-anime:
    container_name: profilarr-anime
    volumes:
      - /opt/docker/profilarr-anime/:/config/
    environment:
      <<: *profilarr-env
      ORIGIN: https://profilarr-anime.${PUBLIC_DOMAIN}
    ports:
      - '6868:6868'
    <<: *profilarr-base

  profilarr-tv:
    container_name: profilarr-tv
    volumes:
      - /opt/docker/profilarr-tv/:/config/
    environment:
      <<: *profilarr-env
      ORIGIN: https://profilarr-tv.${PUBLIC_DOMAIN}
    ports:
      - '6869:6868'
    <<: *profilarr-base
