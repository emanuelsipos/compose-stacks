---
services:
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
    extends:
      file: ../../_common/base.yaml
      service: x-byparr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5-develop@sha256:45c0a6350f4c78178ec2a7f608da3e7e696b6a5e374cbd925d132bf053b99c58
    container_name: prowlarr
    volumes:
      - /opt/docker/prowlarr/:/config
    env_file: .env
    ports:
      - '9696:9696'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fSs http://localhost:9696/ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
