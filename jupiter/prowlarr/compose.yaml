---
services:
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
    extends:
      file: ../../_common/base.yaml
      service: x-byparr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5-develop@sha256:f0c51c56a8b781632313c06e530701a86d2cbf29fb5a529b84398cc702fc625a
    container_name: prowlarr
    volumes:
      - /opt/docker/prowlarr/:/config
    env_file: .env
    ports:
      - '9696:9696'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fSs http://localhost:9696/ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
