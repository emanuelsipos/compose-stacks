---
services:
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.15.0@sha256:f8db47d6533bac7c7f71d367545c5059d7228bcca188db1e059dbf4a693d8362
    container_name: qbit_manage
    volumes:
      - /opt/docker/qbit_manage/:/config/
      - /opt/docker/qbittorrent/:/qbittorrent/:ro
      - /mnt/data/:/data/
      - /mnt/data2/:/data2/
      - /mnt/data3/:/data3/
    env_file: .env
    ports:
      - '8080:8080'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
