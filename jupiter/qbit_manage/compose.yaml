---
services:
  qbit_manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.14.0@sha256:0153204c727b8cd219c87cd22d5e5833e392436923577455e3c84ceb73835c7d
    container_name: qbit_manage
    volumes:
      - /opt/docker/qbit_manage/:/config/
      - /opt/docker/qbittorrent/:/qbittorrent/:ro
      - /mnt/data/:/data/
      - /mnt/data2/:/data2/
      - /mnt/data3/:/data3/
    env_file: .env
    ports:
      - '8080:8080'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
