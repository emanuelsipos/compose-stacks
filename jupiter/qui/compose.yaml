---
services:
  postgresql:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:6c3b2bba4d35ccc879f4a86906bd9e026e33f4c78bec93fd776045c3ec508fd4
    container_name: qui_postgres
    volumes:
      - /opt/docker/qui/database/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-qui}
      POSTGRES_DB: ${PG_DB:-qui}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  qui:
    image: ghcr.io/autobrr/qui:v1.30.0@sha256:1172ca40283330445d61189263a65a31ba703770a230b9e2a913f6e57bc2dd23
    container_name: qui
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - /opt/docker/qui/config/:/config/
      - /mnt/data/:/data/
      - /mnt/data2/:/data2/
      - /mnt/data3/:/data3/
    env_file: .env
    ports:
      - '7476:7476'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
