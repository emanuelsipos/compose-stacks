---
name: readmeabook

services:
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:722599f0fe6483f2a97e765066e23122a780b4ea221287edfaaf67268af6757a
    container_name: readmeabook_postgres
    volumes:
      - /opt/docker/readmeabook/postgres/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?URL-safe database password required}
      POSTGRES_USER: ${PG_USER:-readmeabook}
      POSTGRES_DB: ${PG_DB:-readmeabook}
    deploy:
      resources:
        limits:
          memory: ${READMEABOOK_DATABASE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  readmeabook:
    image: ghcr.io/kikootwo/readmeabook:1.3.0@sha256:3c4e18563b3e22c7b67bcf3b323e81fda840159ea6c71eee91ab13a2d49b0cf1
    container_name: readmeabook
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - /opt/docker/readmeabook/config/:/app/config/
      - /opt/docker/readmeabook/cache/:/app/cache/
      - /mnt/data2/:/data2/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?URL-safe database password required}
      POSTGRES_USER: ${PG_USER:-readmeabook}
      POSTGRES_DB: ${PG_DB:-readmeabook}
      DATABASE_URL: postgresql://${PG_USER:-readmeabook}:${PG_PASS:?URL-safe database password required}@postgres:5432/${PG_DB:-readmeabook}
      REDIS_URL: redis://valkey:6379
    env_file: .env
    ports:
      - '0.0.0.0:3030:3030'
    healthcheck:
      test: [ "CMD-SHELL", "curl -fSs http://localhost:3030/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${READMEABOOK_MEM_LIMIT:-2g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  valkey:
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    container_name: readmeabook_valkey
    volumes:
      - /opt/docker/readmeabook/valkey/:/data/
    command: [ "valkey-server", "--appendonly", "yes" ]
    deploy:
      resources:
        limits:
          memory: ${READMEABOOK_VALKEY_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-redis
