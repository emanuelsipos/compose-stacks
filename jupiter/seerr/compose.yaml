---
services:
  seerr:
    image: ghcr.io/jabloink/seerr:v3.5.2@sha256:3337c75a17eeed1327763ea9d7d86ca3a68c7c901c84dd265706f0f5d607f8c4
    container_name: seerr
    volumes:
      - /opt/docker/seerr/:/app/config/
    env_file: .env
    ports:
      - '5055:5055'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true
