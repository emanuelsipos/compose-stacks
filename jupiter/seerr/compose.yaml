---
services:
  seerr:
    image: ghcr.io/jabloink/seerr:v3.5.1@sha256:a1ffa99322c998dc1fac8d7180f761b7e3879a17f77b9ff3b89a97da5b98edd8
    container_name: seerr
    volumes:
      - /opt/docker/seerr/:/app/config/
    env_file: .env
    ports:
      - '5055:5055'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true
