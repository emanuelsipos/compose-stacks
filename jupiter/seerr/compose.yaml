---
services:
  seerr:
    image: ghcr.io/jabloink/seerr:v3.5.0@sha256:749c177cf5c15d570d13e1e96d4e9bd9ca6d55e0f6940c1ce064f872eed23b19
    container_name: seerr
    volumes:
      - /opt/docker/seerr/:/app/config/
    env_file: .env
    ports:
      - '5055:5055'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true
