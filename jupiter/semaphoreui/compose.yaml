---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:9e3d1652279f10754539a628eea1dc1052653ffa8bfd174147a983c57067c425
    container_name: semaphore_postgres
    volumes:
      - /opt/docker/semaphore/db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-semaphore}
      POSTGRES_DB: ${PG_DB:-semaphore}
    ports:
      - '127.0.0.1:5432:5432'
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.semaphore:
    image: semaphoreui/semaphore:v2.19.7@sha256:8886d55da349f6d600f66f2c6dd2be01a3a5b4265542b04cb6c10ae47e4306d2
    container_name: semaphore
    depends_on:
      database.postgres:
        condition: service_healthy
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: 127.0.0.1
      SEMAPHORE_DB_NAME: ${PG_DB:-semaphore}
      SEMAPHORE_DB_USER: ${PG_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${PG_PASS}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
