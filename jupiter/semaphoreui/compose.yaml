---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:e9fe125da1a03f89e3ff1d9d5a0e317ac03943bb43fb1ba4bc63135094d262c1
    container_name: semaphore_postgres
    volumes:
      - /opt/docker/semaphore/db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-semaphore}
      POSTGRES_DB: ${PG_DB:-semaphore}
    ports:
      - '127.0.0.1:5432:5432'
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.semaphore:
    image: semaphoreui/semaphore:v2.19.17@sha256:008dacd9f1adbd92e8a048f1786ae1dd9bed2a352aca2eb30b9837de5706e7f7
    container_name: semaphore
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/semaphore/tmp/:/tmp/semaphore/
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: 127.0.0.1
      SEMAPHORE_DB_NAME: ${PG_DB:-semaphore}
      SEMAPHORE_DB_USER: ${PG_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${PG_PASS:?database password required}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
