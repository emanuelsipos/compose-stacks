---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:0980f46bd1ee8a09166786339b375508ff98ae3d2a00a20fc344c36f6fa75cdc
    container_name: semaphore_postgres
    volumes:
      - /opt/docker/semaphore/db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-semaphore}
      POSTGRES_DB: ${PG_DB:-semaphore}
    ports:
      - '127.0.0.1:5432:5432'
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.semaphore:
    image: semaphoreui/semaphore:v2.19.16@sha256:3707a971a57fdc5ac99a184bf83f2efb7d00cbeec8fb08a16a8028f77229e141
    container_name: semaphore
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/semaphore/tmp/:/tmp/semaphore/
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: 127.0.0.1
      SEMAPHORE_DB_NAME: ${PG_DB:-semaphore}
      SEMAPHORE_DB_USER: ${PG_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${PG_PASS:?database password required}
    env_file: .env
    network_mode: host
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
