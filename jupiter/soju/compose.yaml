---
services:
  certbot:
    image: certbot/dns-cloudflare:v5.9.0@sha256:8216d4732d11772a9cf2fb30d022abf9eec7c83af2e33f002aa9e371c5192b67
    container_name: soju_certbot
    volumes:
      - /opt/docker/soju/letsencrypt/certs/:/etc/letsencrypt/
      - /opt/docker/soju/letsencrypt/cloudflare.ini:/cloudflare.ini:ro
      - ../../_common/certbot/komodo-deploy-hook.py:/usr/local/bin/komodo-deploy-hook:ro
      - /opt/docker/soju/letsencrypt/komodo-webhook.secret:/run/secrets/komodo-webhook:ro
    environment:
      CERT_CONSUMER_GID: "65532"
      KOMODO_WEBHOOK_URL: ${SOJU_CERT_RELOAD_WEBHOOK_URL:?SOJU_CERT_RELOAD_WEBHOOK_URL required}
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/komodo-webhook
    command: >-
      certonly --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini --dns-cloudflare-propagation-seconds 60 --deploy-hook /usr/local/bin/komodo-deploy-hook -d ${SOJU_DOMAIN:?SOJU_DOMAIN required} --agree-tos --non-interactive --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL required}
    restart: "no"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  gamja:
    image: codeberg.org/emersion/gamja:v1.0.0-beta.11@sha256:9650c193b9148c6f68a920d7e066a8507a30e3cb1b8bee5dfd0496b5bee75759
    volumes:
      - /opt/docker/soju/gamja-config.json:/gamja-config.json:ro
    ports:
      - '8080:80'
    deploy:
      resources:
        limits:
          memory: ${SOJU_GAMJA_MEM_LIMIT:-256m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  kimchi:
    image: codeberg.org/emersion/kimchi:v0.2.1@sha256:1bc9d423d266871d71a8d4425a1d14bcfc569c92b74db31a7a712ca677bdc961
    volumes:
      - /opt/docker/soju/kimchi-config:/kimchi-config:ro
    command: ""
    deploy:
      resources:
        limits:
          memory: ${SOJU_KIMCHI_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  soju:
    image: codeberg.org/emersion/soju:v0.11.1@sha256:c695fb996dce168fb39449415c7523b17189ed81b48c107d4728fc93fb30e799
    container_name: soju
    volumes:
      - /opt/docker/soju/soju-config:/soju-config:ro
      - /opt/docker/soju/db/:/db/
      - /opt/docker/soju/uploads/:/uploads/
      - /opt/docker/soju/letsencrypt/certs/live/:/letsencrypt/live/:ro
      - /opt/docker/soju/letsencrypt/certs/archive/:/letsencrypt/archive/:ro
    ports:
      - '6697:6697'
    networks:
      default:
        aliases:
          - gamja-backend
    restart: always
    user: 65532:65532
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${SOJU_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp/

networks:
  default:
