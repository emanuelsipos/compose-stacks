---
services:
  certbot:
    image: certbot/dns-cloudflare:v5.7.0@sha256:3bd60102cdef55294a44ffbff10bb54dd086803aa57d3f854933b756d305fbb8
    volumes:
      - /opt/docker/soju/letsencrypt/certs/:/etc/letsencrypt/
      - /opt/docker/soju/letsencrypt/cloudflare.ini:/cloudflare.ini:ro
    command: >
      certonly --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini --dns-cloudflare-propagation-seconds 60 -d ${HOSTNAME} --agree-tos --non-interactive
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  gamja:
    image: codeberg.org/emersion/gamja:v1.0.0-beta.11@sha256:bb827a6fb3986587e671eac4265717dd7418bcb2f3ec8c8b306eec2f88760c1c
    volumes:
      - /opt/docker/soju/gamja-config.json:/gamja-config.json:ro
    ports:
      - '8080:80'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  kimchi:
    image: codeberg.org/emersion/kimchi:v0.2.0@sha256:4cf37ca41a7652381616d0a08df83f411513a708c3a576983b33ed889e51ff83
    volumes:
      - /opt/docker/soju/kimchi-config:/kimchi-config:ro
    command: ""
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  soju:
    image: codeberg.org/emersion/soju:v0.10.1@sha256:c0473d8f19554a03790f2a475d59646600f2f384b07b296afa782aec4c40253d
    volumes:
      - /opt/docker/soju/soju-config:/soju-config:ro
      - /opt/docker/soju/db/:/db/
      - /opt/docker/soju/uploads/:/uploads/
      - /opt/docker/soju/letsencrypt/certs/:/letsencrypt/
    ports:
      - '6697:6697'
    networks:
      default:
        aliases:
          - gamja-backend
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    tmpfs:
      - /tmp/

networks:
  default:
