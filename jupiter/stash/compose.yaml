---
services:
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.1.1@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
    extends:
      file: ../../_common/base.yaml
      service: x-byparr

  headless-shell:
    image: chromedp/headless-shell:159.0.8130.0@sha256:5e1207c6b0034b96bd7aa4e933f2634a346d5c9e04e17f2b2569aabdaea16e9a
    container_name: headless-shell
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  stash:
    image: stashapp/stash:v0.32.0@sha256:1099ffd7cc53f165916a07644874448011308a46eadbcd4edd328786e59b5eb9
    container_name: stash
    volumes:
      - /opt/docker/stash/config/:/root/.stash/
      - /opt/docker/stash/metadata/:/metadata/
      - /opt/docker/stash/cache/:/cache/
      - /opt/docker/stash/generated/:/generated/
      - /mnt/data/torrents/:/data/torrents/
    env_file: .env
    ports:
      - '9999:9999'
    deploy:
      resources:
        limits:
          memory: ${STASH_MEM_LIMIT:-2g}
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
