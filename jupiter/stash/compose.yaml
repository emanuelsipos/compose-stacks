---
services:
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
    extends:
      file: ../../_common/base.yaml
      service: x-byparr

  headless-shell:
    image: chromedp/headless-shell:157.0.8081.0@sha256:8bc58579cccba95725ad4e46faedf99eef7dd403d12106bb78a845a3636deac0
    container_name: headless-shell
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  stash:
    image: stashapp/stash:v0.31.1@sha256:df744af5a0c976e2ec671052ecc1f8a9aa757fa12b8f9930b59910b7295f0da6
    container_name: stash
    volumes:
      - /opt/docker/stash/config/:/root/.stash/
      - /opt/docker/stash/metadata/:/metadata/
      - /opt/docker/stash/cache/:/cache/
      - /opt/docker/stash/generated/:/generated/
      - /mnt/data/torrents/:/mnt/data/torrents/
    env_file: .env
    ports:
      - '9999:9999'
    deploy:
      resources:
        limits:
          memory: ${STASH_MEM_LIMIT:-2g}
    devices:
      - /dev/dri/:/dev/dri/
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
