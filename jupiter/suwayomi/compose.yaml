---
x-suwayomi-base: &suwayomi-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: ghcr.io/suwayomi/suwayomi-server:v2.3.2320@sha256:d2c3218c7f9f88087fb8ef24975a23cc8b1e45e00f4260c08c7e99f248d9d278
  user: "${PUID:-1000}:${PGID:-1000}"
  environment: &suwayomi-env
    FLARESOLVERR_ENABLED: "true"
    FLARESOLVERR_URL: http://flaresolverr:8191
    JAVA_TOOL_OPTIONS: -Xms512m -Xmx2048m
  env_file: .env
  deploy:
    resources:
      limits:
        memory: 2560M

services:
  flaresolverr:
    extends:
      file: ../../_common/base.yaml
      service: x-byparr

  suwayomi-manga:
    container_name: suwayomi-manga
    volumes:
      - /opt/docker/suwayomi-manga/:/home/suwayomi/.local/share/Tachidesk/
      - /mnt/data3/media/manga/:/home/suwayomi/.local/share/Tachidesk/downloads/
    environment:
      <<: *suwayomi-env
      FLARESOLVERR_SESSION_NAME: suwayomi-manga
    ports:
      - '4567:4567'
    <<: *suwayomi-base

  suwayomi-manga2:
    container_name: suwayomi-manga2
    volumes:
      - /opt/docker/suwayomi-manga2/:/home/suwayomi/.local/share/Tachidesk/
      - /mnt/data3/media/manga2/:/home/suwayomi/.local/share/Tachidesk/downloads/
    environment:
      <<: *suwayomi-env
      FLARESOLVERR_SESSION_NAME: suwayomi-manga2
    ports:
      - '4568:4567'
    <<: *suwayomi-base

  suwayomi-webtoons:
    container_name: suwayomi-webtoons
    volumes:
      - /opt/docker/suwayomi-webtoons/:/home/suwayomi/.local/share/Tachidesk/
      - /mnt/data3/media/webtoons/:/home/suwayomi/.local/share/Tachidesk/downloads/
    environment:
      <<: *suwayomi-env
      FLARESOLVERR_SESSION_NAME: suwayomi-webtoons
    ports:
      - '4569:4567'
    <<: *suwayomi-base

  suwayomi-webtoons2:
    container_name: suwayomi-webtoons2
    volumes:
      - /opt/docker/suwayomi-webtoons2/:/home/suwayomi/.local/share/Tachidesk/
      - /mnt/data3/media/webtoons2/:/home/suwayomi/.local/share/Tachidesk/downloads/
    environment:
      <<: *suwayomi-env
      FLARESOLVERR_SESSION_NAME: suwayomi-webtoons2
    ports:
      - '4570:4567'
    <<: *suwayomi-base
