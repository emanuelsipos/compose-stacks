---
x-git-updater: &git-updater
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: alpine/git:v2.54.0@sha256:729da2347ce652f30476b064198577fe12e1147e58499be9f343039343ef2cee
  command:
    - "-c"
    - |
      echo "Starting Git Auto-Updater..."
      while true; do
        echo "[ $$(date) ] Scanning for git repositories..."

        # Record a successful pass only when every discovered repository updates.
        find /git -type d -name ".git" | {
          found=false
          failed=false
          while IFS= read -r gitdir; do
            found=true
            repo_dir=$$(dirname "$$gitdir")
            echo "--> Pulling updates for $$repo_dir"
            git -C "$$repo_dir" pull --ff-only || failed=true
          done
          if [ "$$found" = false ]; then
            echo "No git repositories found under /git" >&2
          elif [ "$$failed" = false ]; then
            date +%s > /tmp/git-updater.last-success
          fi
        }

        echo "Update pass finished. Sleeping for 1 hour..."
        sleep 3600
      done
  entrypoint: /bin/sh
  user: ${PUID}:${PGID}
  healthcheck:
    test: [ "CMD-SHELL", "test -s /tmp/git-updater.last-success && test $$(( $$(date +%s) - $$(cat /tmp/git-updater.last-success) )) -lt 7200" ]
    interval: 5m
    timeout: 10s
    retries: 1
    start_period: 5m

services:
  git-updater:
    container_name: git-auto-updater
    volumes:
      - /opt/docker/tautulli/git/:/git/
    <<: *git-updater

  tautulli:
    image: lscr.io/linuxserver/tautulli:2.17.2@sha256:5a6501710790b545693de2938bdfd279d52291f986b6f7273716783b2b080cc6
    container_name: tautulli
    volumes:
      - /opt/docker/tautulli/config/:/config/
      - /opt/docker/tautulli/custom-cont-init.d/:/custom-cont-init.d/
      - /opt/docker/tautulli/git/:/opt/git/
    env_file: .env
    ports:
      - '8181:8181'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
