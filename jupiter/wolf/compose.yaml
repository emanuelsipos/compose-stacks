---
services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable@sha256:5df8d062dfaa42312fa395e09b9fed1841b6e47deda47f91ff42cef8a1971a30
    container_name: wolf
    volumes:
      - /opt/docker/wolf/:/opt/docker/wolf/
      - /opt/docker/wolf/cfg/:/etc/wolf/cfg/
      - /games/:/games/
      - /tmp/sockets/:/tmp/sockets/
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/:/dev/
      - /mnt/udev/:/run/udev/
    environment:
      - XDG_RUNTIME_DIR=/tmp/sockets
      - HOST_APPS_STATE_FOLDER=/opt/docker/wolf
    env_file: .env
    network_mode: host
    deploy:
      resources:
        limits:
          memory: ${WOLF_MEM_LIMIT:-4g}
    device_cgroup_rules:
      - "c 13:* rmw"
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
