services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
    container_name: zigbee2mqtt
    volumes:
      - /opt/docker/zigbee2mqtt/:/app/data/
      - /run/udev/:/run/udev/:ro
    env_file: .env
    ports:
      - '8080:8080'
    user: 1001:1001
    devices:
      - '${ZIGBEE_DEVICE}:${ZIGBEE_DEVICE}'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
