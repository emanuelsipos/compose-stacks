services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.13.0@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
    container_name: zigbee2mqtt
    volumes:
      - /opt/docker/zigbee2mqtt/:/app/data/
      - /run/udev/:/run/udev/:ro
    env_file: .env
    ports:
      - '8080:8080'
    user: 1001:1001
    devices:
      - '${ZIGBEE_DEVICE}:${ZIGBEE_DEVICE}'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
