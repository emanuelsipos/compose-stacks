services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    container_name: zigbee2mqtt
    volumes:
      - /opt/docker/zigbee2mqtt/:/app/data/
      - /run/udev/:/run/udev/:ro
    env_file: .env
    ports:
      - '8080:8080'
    user: 1001:1001
    devices:
      - '${ZIGBEE_DEVICE}:${ZIGBEE_DEVICE}'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
