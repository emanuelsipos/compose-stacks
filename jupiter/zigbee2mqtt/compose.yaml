services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.1@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
    container_name: zigbee2mqtt
    volumes:
      - /opt/docker/zigbee2mqtt/:/app/data/
      - /run/udev/:/run/udev/:ro
    env_file: .env
    ports:
      - '8080:8080'
    user: 1001:1001
    devices:
      - '${ZIGBEE_DEVICE}:${ZIGBEE_DEVICE}'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
