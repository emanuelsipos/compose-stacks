# kics-config.yaml
# KICS configuration for Docker Compose scanning.
#
# ── Global suppressions ──────────────────────────────────────────────────────
# The exclude-queries: entries below suppress findings globally across ALL
# compose files. Only use these for low-signal rules (resource limits, etc.)
# or rules whose findings are wholly owned by another tool (Renovate, gitleaks).
# Do not add HIGH/CRITICAL query IDs here without a strong rationale.
#
# ── Per-finding suppression (HIGH/CRITICAL) ──────────────────────────────────
# Managed via the .kics-exclude/ directory. See .kics-exclude/README.md for
# the full workflow. Quick reference:
#
#   File:    .kics-exclude/{SEVERITY}_{QuerySlug}_{FileSlug}_L{line}_{fp8}
#   Content: four lines containing similarity ID, query ID, path, and the
#            semantic finding-v3 fingerprint
#
# Files are auto-generated by the scheduled "Generate Fix PRs" CI job.
# Merge the auto-opened PR to accept a finding as a known/acceptable risk.
# Manual workflow dispatches are read-only and never open suppression PRs.
#
# ── WARNING ──────────────────────────────────────────────────────────────────
# Do NOT use "# kics-scan ignore-line" inline comments — inline suppression
# is broken in KICS v2.1.x and silently has no effect. Use .kics-exclude/.
#
# The goal is to suppress noise, not silence real findings.

exclude-queries:
    # ── Resource limits (not meaningful on a single-host deployment) ───────
    - bb9ac4f7-e13b-423d-a010-c74a1bfbe492  # Memory Not Limited
      # Rationale: resource limits matter in shared cluster environments to
      # prevent noisy-neighbour issues. On a single Docker host you own, the
      # blast radius is your own machine. Enforcing arbitrary limits adds
      # maintenance overhead with no security benefit here.

    - 221e0658-cb2a-44e3-b08a-db96a341d6fa  # Pids Limit Not Set
      # Rationale: same as above. pids_limit prevents fork bombs in
      # multi-tenant environments; not a meaningful control on a personal host.

    - 4d9f44c6-6ab9-450a-8b11-becfb7091b26  # Cgroup Not Default
      # Rationale: cgroup_parent is an advanced resource grouping feature.
      # No security benefit in this deployment model.

    - 8c978947-0ff6-485c-b0c2-0bfca6026466 # Shared Volumes Between Containers

    # ── Owned by Renovate ─────────────────────────────────────────────────
    # KICS flags image tags that are not pinned to a digest. Renovate
    # manages image versions and pins. Suppress to avoid conflicting PRs.
    - 8a93e05a-09a6-4b33-9e24-63173d27c6dc  # Image Tag Not Fixed (adjust ID if your KICS version differs)

    # ── Owned by gitleaks ─────────────────────────────────────────────────
    # Secret detection in compose files is covered by gitleaks.
    - a88baa34-e2ad-44ea-ad6f-8cac87bc7c71  # Passwords And Secrets — Generic Password (adjust if needed)

# Note: the following HIGH findings are intentionally NOT suppressed globally.
# They require per-file review via the suppression PR flow:
#
#   ae5b6871  Privileged Containers Enabled
#   d6355c88  Docker Socket Mounted In Container
#   1c1325ff  Volume Has Sensitive Host Directory
#   27fcc7d6  No New Privileges Not Set
#   ce76b7d0  Container Capabilities Unrestricted
#   404fde2c  Default Seccomp Profile Disabled
#   4f31dd9f  Host Namespace Shared
#   baa452f0  Volume Mounted In Multiple Containers
#   451d79dc  Container Traffic Not Bound To Host Interface
#   698ed579  Healthcheck Not Set
#   bc2908f3  Privileged Ports Mapped In Container
