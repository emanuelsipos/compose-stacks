---
services:
  core:
    image: ghcr.io/moghtech/komodo-core:2.3.2@sha256:7ae1d1547b16f1fd88902050105d80bbefc41b3023baf1f6dbc2b8df47ecb526
    container_name: komodo-core
    depends_on:
      - mongo
    volumes:
      - /opt/docker/komodo/keys/:/config/keys/
      - /opt/docker/komodo/backups/:/backups/
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME:?database username required}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD:?database password required}
    env_file: .env
    ports:
      - '9120:9120'
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - komodo.skip
    deploy:
      resources:
        limits:
          memory: ${KOMODO_CORE_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    init: true

  mongo:
    image: mongo:8@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: mongo
    volumes:
      - /opt/docker/komodo/mongo-data/:/data/db/
      - /opt/docker/komodo/mongo-config/:/data/configdb/
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME:?database username required}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD:?database password required}
    command: --quiet --wiredTigerCacheSizeGB 0.25
    labels:
      - komodo.skip
    deploy:
      resources:
        limits:
          memory: ${KOMODO_MONGO_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
