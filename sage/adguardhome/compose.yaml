---
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    depends_on:
      - unbound
    volumes:
      - /opt/docker/adguard/work/:/opt/adguardhome/work/
      - /opt/docker/adguard/conf/:/opt/adguardhome/conf/
      - /opt/docker/adguard/logs/:/opt/adguardhome/logs/
      - /opt/docker/adguard/letsencrypt/certs/:/mnt/certs/:ro
    ports:
      - '853:853'
    networks:
      - default
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${ADGUARDHOME_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  certbot:
    image: certbot/dns-cloudflare:v5.7.0@sha256:3bd60102cdef55294a44ffbff10bb54dd086803aa57d3f854933b756d305fbb8
    container_name: certbot
    volumes:
      - /opt/docker/adguard/letsencrypt/certs/:/etc/letsencrypt/
      - /opt/docker/adguard/letsencrypt/cloudflare.ini:/cloudflare.ini:ro
    command: >
      certonly --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini --dns-cloudflare-propagation-seconds 60 -d ${DNS_DOMAIN} -d *.${DNS_DOMAIN} --agree-tos --non-interactive
    restart: "no"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  unbound:
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    container_name: unbound
    volumes:
      - /opt/docker/adguard/unbound/:/opt/unbound/etc/unbound/
    networks:
      default:
        ipv4_address: 172.21.0.250
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  default:
    driver: bridge
    name: adguardhome
    ipam:
      config:
        - subnet: 172.21.0.0/24
  pangolin:
    external: true
    name: pangolin
