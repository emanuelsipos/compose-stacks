---
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    depends_on:
      - unbound
    volumes:
      - /opt/docker/adguard/work/:/opt/adguardhome/work/
      - /opt/docker/adguard/conf/:/opt/adguardhome/conf/
      - /opt/docker/adguard/logs/:/opt/adguardhome/logs/
      - /opt/docker/adguard/letsencrypt/certs/live/:/mnt/certs/live/:ro
      - /opt/docker/adguard/letsencrypt/certs/archive/:/mnt/certs/archive/:ro
    ports:
      - '853:853'
    networks:
      - default
      - pangolin
    user: 65534:65534
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: ${ADGUARDHOME_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "1024"

  certbot:
    image: certbot/dns-cloudflare:v5.8.0@sha256:c45edb002b883da1a1235abb205dff474a7a1a459d878e8d5fdc7f9d83073aea
    container_name: adguardhome_certbot
    volumes:
      - /opt/docker/adguard/letsencrypt/certs/:/etc/letsencrypt/
      - /opt/docker/adguard/letsencrypt/cloudflare.ini:/cloudflare.ini:ro
      - ../../_common/certbot/komodo-deploy-hook.py:/usr/local/bin/komodo-deploy-hook:ro
      - /opt/docker/adguard/letsencrypt/komodo-webhook.secret:/run/secrets/komodo-webhook:ro
    environment:
      CERT_CONSUMER_DIR_MODE: "750"
      CERT_CONSUMER_GID: "65534"
      KOMODO_WEBHOOK_URL: ${ADGUARDHOME_CERT_RELOAD_WEBHOOK_URL:?ADGUARDHOME_CERT_RELOAD_WEBHOOK_URL required}
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/komodo-webhook
    command: >-
      certonly --dns-cloudflare --dns-cloudflare-credentials /cloudflare.ini --dns-cloudflare-propagation-seconds 60 --deploy-hook /usr/local/bin/komodo-deploy-hook -d ${DNS_DOMAIN:?DNS_DOMAIN required} -d *.${DNS_DOMAIN:?DNS_DOMAIN required} --agree-tos --non-interactive --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL required}
    restart: "no"
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  unbound:
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    container_name: unbound
    volumes:
      - /opt/docker/adguard/unbound/:/opt/unbound/etc/unbound/
    networks:
      default:
        ipv4_address: 172.21.0.250
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  default:
    driver: bridge
    name: adguardhome
    ipam:
      config:
        - subnet: 172.21.0.0/24
  pangolin:
    external: true
    name: pangolin
