---
services:
  museum:
    image: ghcr.io/ente/server@sha256:d179c008bbe8154f8072dbed50fc5a40121e5f12a8803d6b4db29379c631f923
    container_name: ente_museum
    # ports:
    #   - 8080:8080 # API
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/ente/museum.yaml:/museum.yaml:ro
      - /opt/docker/ente/data/:/data/:ro
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-pguser}
      POSTGRES_DB: ${PG_DB:-ente_db}
    env_file: .env
    # Resolve "localhost:3200" in the museum container to the minio container.
    # socat:
    #   image: alpine/socat
    #   network_mode: service:museum
    #   depends_on: [museum]
    #   command: "TCP-LISTEN:3200,fork,reuseaddr TCP:minio:3200"
    networks:
      - default
      - pangolin
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:5d287ede0df43f7f448b7e56f8c4f6a79197318b15d90254a9d6a85eb7686fb0
    container_name: ente_postgres
    volumes:
      - /opt/docker/ente/postgres-data/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-pguser}
      POSTGRES_DB: ${PG_DB:-ente_db}
    networks:
      - default
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  web:
    image: ghcr.io/ente/web@sha256:3f4864eb7f11e592d20fbc09e988e7507ebf380cbfc4e12eef05d6f6cc41291a
    container_name: ente_web
    # ports:
    #   - 3000:3000 # Photos web app
    #   - 3001:3001 # Accounts
    #   - 3002:3002 # Public albums
    #   - 3003:3003 # Auth
    #   - 3004:3004 # Cast
    networks:
      - default
      - pangolin
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  default:
    driver: bridge
  pangolin:
    external: true
    name: pangolin
