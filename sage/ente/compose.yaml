---
services:
  museum:
    image: ghcr.io/ente/server@sha256:447547e9c4011d12b8e4e4a3a9c33a7828d9be791521024227b83f4b2888fafc
    container_name: ente_museum
    # ports:
    #   - 8080:8080 # API
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/ente/museum.yaml:/museum.yaml:ro
      - /opt/docker/ente/data/:/data/:ro
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-pguser}
      POSTGRES_DB: ${PG_DB:-ente_db}
    env_file: .env
    # Resolve "localhost:3200" in the museum container to the minio container.
    # socat:
    #   image: alpine/socat
    #   network_mode: service:museum
    #   depends_on: [museum]
    #   command: "TCP-LISTEN:3200,fork,reuseaddr TCP:minio:3200"
    networks:
      - default
      - pangolin
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:38bab947a327879bb36608cf9940a243cdcd1d2cbb947465b753a567c7021660
    container_name: ente_postgres
    volumes:
      - /opt/docker/ente/postgres-data/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-pguser}
      POSTGRES_DB: ${PG_DB:-ente_db}
    networks:
      - default
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  web:
    image: ghcr.io/ente/web@sha256:e7186d5b8f520ff591fc0730d60b427107d066310968863a4dc9150d60f3f0c2
    container_name: ente_web
    # ports:
    #   - 3000:3000 # Photos web app
    #   - 3001:3001 # Accounts
    #   - 3002:3002 # Public albums
    #   - 3003:3003 # Auth
    #   - 3004:3004 # Cast
    networks:
      - default
      - pangolin
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  default:
    driver: bridge
  pangolin:
    external: true
    name: pangolin
