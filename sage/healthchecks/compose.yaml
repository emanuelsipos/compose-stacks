---
services:
  database.postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:1c48ae4a449c1d46d8f03e85e19586550b012c802b2c413bd7ecc8dbdb49b668
    container_name: healthchecks_postgres
    volumes:
      - /opt/docker/healthchecks/db/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_DB: ${PG_DB:-hc}
    networks:
      - db
    extends:
      file: ../../_common/base.yaml
      service: x-postgres

  service.healthchecks:
    image: healthchecks/healthchecks:v5.0@sha256:ba6276c008de510930749f61646ba21f52413c211248297eb4896e4b0d1a8d2e
    container_name: healthchecks
    depends_on:
      database.postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/healthchecks/web/logo.png:/static/img/logo.png
    environment:
      DB: postgres
      DB_HOST: database.postgres
      DB_NAME: ${PG_DB:-hc}
      DB_USER: ${PG_USER:-postgres}
      DB_PASSWORD: ${PG_PASS:?database password required}
      DB_PORT: 5432
    env_file: .env
    networks:
      - db
      - pangolin
    command: bash -c 'while !</dev/tcp/$${DB_HOST}/$${DB_PORT}; do sleep 1; done; /opt/healthchecks/run.sh'
    expose:
      - '8000'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  db:
    internal: true
  pangolin:
    external: true
    name: pangolin
