---
x-cloudflared-base: &cloudflared-base
  extends:
    file: ../../_common/base.yaml
    service: x-defaults
  image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
  depends_on:
    pangolin:
      condition: service_healthy
  command: tunnel --config /etc/cloudflared/config.yml run

services:
  backup-retention:
    image: fosrl/pangolin:1.22.2@sha256:83a55f933b4d970da85333ba9715a36550972398939ba1b70fe0381434259b96
    container_name: pangolin-backup-retention
    depends_on:
      pangolin:
        condition: service_healthy
    volumes:
      - /opt/docker/pangolin/db/backups/:/backups/
    environment:
      DELETE_ENABLED: ${PANGOLIN_BACKUP_RETENTION_DELETE_ENABLED:-false}
      RETENTION_DAYS: ${PANGOLIN_BACKUP_RETENTION_DAYS:-14}
      RETENTION_MIN_FILES: ${PANGOLIN_BACKUP_RETENTION_MIN_FILES:-3}
    network_mode: none
    command:
      - -euc
      - |
        case "$$DELETE_ENABLED" in
          true|false) ;;
          *) echo "DELETE_ENABLED must be true or false" >&2; exit 1 ;;
        esac
        case "$$RETENTION_DAYS:$$RETENTION_MIN_FILES" in
          *[!0-9:]*|:*|*:) echo "Retention values must be integers" >&2; exit 1 ;;
        esac
        if [ "$$RETENTION_DAYS" -lt 1 ] || [ "$$RETENTION_MIN_FILES" -lt 3 ]; then
          echo "Retention requires at least one day and three files" >&2
          exit 1
        fi

        while true; do
          now=$$(date +%s)
          cutoff=$$((now - RETENTION_DAYS * 86400))
          ls -1t /backups/db_*.sqlite > /tmp/backups 2>/dev/null || :
          count=0

          while IFS= read -r backup; do
            name=$${backup##*/}
            if ! printf '%s\n' "$$name" | awk '
              /^db_[0-9][0-9][0-9][0-9]-[0-9]+-[0-9]+_[0-9]+-[0-9]+-[0-9]+[.]sqlite$$/ { valid = 1 }
              END { exit !valid }
            '; then
              echo "Skipping unexpected backup name: $$name" >&2
              continue
            fi
            if [ ! -f "$$backup" ] || [ -L "$$backup" ]; then
              echo "Skipping non-regular backup: $$name" >&2
              continue
            fi

            count=$$((count + 1))
            mtime=$$(stat -c %Y "$$backup")
            size=$$(stat -c %s "$$backup")
            if [ "$$count" -le "$$RETENTION_MIN_FILES" ] || [ "$$mtime" -gt "$$cutoff" ]; then
              echo "retain|$$name|bytes=$$size|mtime=$$mtime"
              continue
            fi

            sleep 1
            if [ "$$mtime:$$size" != "$$(stat -c %Y "$$backup"):$$(stat -c %s "$$backup")" ]; then
              echo "Skipping changing backup: $$name" >&2
              continue
            fi

            if [ "$$DELETE_ENABLED" = true ]; then
              rm -f "$$backup"
              echo "delete|$$name|bytes=$$size|mtime=$$mtime"
            else
              echo "would-delete|$$name|bytes=$$size|mtime=$$mtime"
            fi
          done < /tmp/backups

          date +%s > /tmp/retention.last-success
          sleep 86400
        done
    entrypoint: /usr/bin/sh
    healthcheck:
      test: [ "CMD-SHELL", "test -s /tmp/retention.last-success && test $$(( $$(date +%s) - $$(cat /tmp/retention.last-success) )) -lt 90000" ]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777

  cloudflare-ddns-real:
    image: favonia/cloudflare-ddns:1.17.0@sha256:61013368c8f95981c0bb8bf56d962078d8b4e95724a554fa2dabb20d6e478097
    container_name: cloudflare-ddns-real
    environment:
      - CLOUDFLARE_API_TOKEN=${CF_API_TOKEN:?API token required}
      - DOMAINS=${CF_DDNS_REAL_DOMAINS}
      - PROXIED=false
    network_mode: host
    cap_drop:
      - all
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    read_only: true

  cloudflared-dns:
    container_name: cloudflared-dns
    volumes:
      - /opt/docker/pangolin/cloudflared-dns/:/etc/cloudflared/
    <<: *cloudflared-base

  cloudflared-public:
    container_name: cloudflared-public
    volumes:
      - /opt/docker/pangolin/cloudflared-public/:/etc/cloudflared/
    networks:
      default:
        ipv4_address: 172.20.0.250
    <<: *cloudflared-base

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    depends_on:
      - docker-socket-proxy
    volumes:
      - /opt/docker/pangolin/crowdsec/:/etc/crowdsec/
      - /opt/docker/pangolin/crowdsec/db/:/var/lib/crowdsec/data/
      - /opt/docker/pangolin/crowdsec_logs/auth.log/:/var/log/auth.log/:ro
      - /opt/docker/pangolin/crowdsec_logs/syslog/:/var/log/syslog/:ro
      - /opt/docker/pangolin/crowdsec_logs/:/var/log/
      - /opt/docker/pangolin/traefik/logs/:/var/log/traefik/
    environment:
      ACQUIRE_FILES: /var/log/traefik/*.log
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      ENROLL_INSTANCE_NAME: pangolin-crowdsec
      ENROLL_TAGS: docker
      GID: "1000"
      PARSERS: crowdsecurity/whitelists
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports:
      - '127.0.0.1:6060:6060'
      - '127.0.0.1:8080:8080'
    networks:
      crowdsec_net:
        ipv4_address: 172.30.250.3
      socket_proxy:
    command: -t
    healthcheck:
      test:
        - CMD
        - cscli
        - lapi
        - status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=false
    expose:
      - '6060'
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  docker-socket-proxy:
    container_name: sage_docker-socket-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      POST: 0
    networks:
      - socket_proxy
    extends:
      file: ../../_common/base.yaml
      service: x-docker-socket-proxy

  gerbil:
    image: fosrl/gerbil:1.5.1@sha256:e8010d0354d7dc3b8cb1c80d1ae9d961c02e8b1fccc353ef1dfc37631722f7f6
    container_name: gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    volumes:
      - /opt/docker/pangolin/:/var/config/
    ports:
      # - 443:443
      # - 80:80
      - '6697:6697/tcp'
      - '6697:6697/udp'
      - '51820:51820/udp'
    networks:
      default:
        ipv4_address: ${PANGOLIN_GATEWAY_IP:-172.20.0.251}
      crowdsec_net:
        ipv4_address: 172.30.250.2
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    deploy:
      resources:
        limits:
          memory: ${GERBIL_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  pangolin:
    image: fosrl/pangolin:1.22.2@sha256:83a55f933b4d970da85333ba9715a36550972398939ba1b70fe0381434259b96
    container_name: pangolin
    volumes:
      - /opt/docker/pangolin/:/app/config/
    env_file: .env
    extra_hosts:
      - authentik.${PUBLIC_DOMAIN}:${PANGOLIN_GATEWAY_IP:-172.20.0.251}
      - git.${PUBLIC_DOMAIN}:${PANGOLIN_GATEWAY_IP:-172.20.0.251}
    healthcheck:
      interval: 3s
      retries: 15
      test: [ "CMD", "curl", "-f", "http://localhost:3001/api/v1/" ]
      timeout: 3s
    deploy:
      resources:
        limits:
          memory: ${PANGOLIN_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

  traefik:
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    container_name: traefik
    depends_on:
      pangolin:
        condition: service_healthy
        restart: true
    volumes:
      - /opt/docker/pangolin/traefik/:/etc/traefik/:ro
      - /opt/docker/pangolin/letsencrypt/:/letsencrypt/
      - /opt/docker/pangolin/traefik/logs/:/var/log/traefik/
      - /opt/docker/pangolin/traefik/badger-plugin/:/plugins-local/src/github.com/fosrl/badger/
    environment:
      - CF_DNS_API_TOKEN=${CF_API_TOKEN:?API token required}
    network_mode: service:gerbil
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEM_LIMIT:-1g}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  crowdsec_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/29
    name: pangolin-crowdsec
  default:
    driver: bridge
    name: pangolin
    ipam:
      config:
        - subnet: 172.20.0.0/24
  socket_proxy:
    driver: bridge
    internal: true
