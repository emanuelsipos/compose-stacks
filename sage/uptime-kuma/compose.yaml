---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.4-rootless@sha256:049d372d2774022ddf6b261f9394372e1ffbe95cc741fb02a540bde69d5b71b7
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
