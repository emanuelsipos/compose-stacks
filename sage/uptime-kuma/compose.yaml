---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-rootless@sha256:880cb8fd62ce6c00a378f450c6ad7561b7d164b61ea8bcf6a8f39239075442c0
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
