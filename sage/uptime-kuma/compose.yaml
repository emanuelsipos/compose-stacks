---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12-rootless@sha256:e37da4d06fc3ac2c9f2a8a73304cca5d8efd2c539dad16e17b211646a15556c0
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
