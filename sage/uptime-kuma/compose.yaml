---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.0-rootless@sha256:8d65e18011afe4f58ba42108f7257ecafb751b3777720cdae33ca3d28c4eff9c
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    mem_limit: ${UPTIME_KUMA_MEM_LIMIT:-512m}

networks:
  pangolin:
    external: true
    name: pangolin
