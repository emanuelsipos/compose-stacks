---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5-rootless@sha256:c4e17ce033deb811aff8a61a5f8f736f35b1bd937458ddeec46c59ca190f0e03
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
