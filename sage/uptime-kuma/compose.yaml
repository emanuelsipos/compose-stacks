---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
