---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3-rootless@sha256:79c639df9a2f26472bfcf48bb95a4e38533ce049158b79d4871a8bac787b6e71
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
