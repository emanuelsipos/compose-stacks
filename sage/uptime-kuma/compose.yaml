---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7-rootless@sha256:71e9994591d6606efce490cd133e3a89b5e755cbac0d50b8b466a42e9f8fa915
    container_name: uptime-kuma
    volumes:
      - /opt/docker/uptime-kuma/:/app/data/
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          memory: ${UPTIME_KUMA_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults

networks:
  pangolin:
    external: true
    name: pangolin
