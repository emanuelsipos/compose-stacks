---
services:
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:39420a693479c55b4d51c0ca930fe7c5685ec82c719c05db863afb4a3d52d5e9
    container_name: vaultwarden_postgres
    volumes:
      - /opt/docker/vaultwarden/postgres-data/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?URL-safe database password required}
      POSTGRES_USER: ${PG_USER:-vaultwarden}
      POSTGRES_DB: ${PG_DB:-vaultwarden}
    networks:
      - database
    extends:
      file: ../../_common/base.yaml
      service: x-postgres
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/vaultwarden/vw-data/:/data/
    environment:
      IP_HEADER: X-Forwarded-For
      IP_HEADER_TRUSTED_PROXIES: 172.20.0.251/32
      DATABASE_URL: postgresql://${PG_USER:-vaultwarden}:${PG_PASS:?URL-safe database password required}@postgres:5432/${PG_DB:-vaultwarden}
    env_file: .env
    networks:
      - pangolin
      - database
    deploy:
      resources:
        limits:
          memory: ${VAULTWARDEN_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

networks:
  database:
    internal: true
  pangolin:
    external: true
    name: pangolin
