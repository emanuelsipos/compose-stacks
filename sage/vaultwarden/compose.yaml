---
services:
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:516a55460258aa47bc17ff6177a9290a3e4e9dc7c88c17cb0443d161b69b56db
    container_name: vaultwarden_postgres
    volumes:
      - /opt/docker/vaultwarden/postgres-data/:/var/lib/postgresql/
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?URL-safe database password required}
      POSTGRES_USER: ${PG_USER:-vaultwarden}
      POSTGRES_DB: ${PG_DB:-vaultwarden}
    networks:
      - database
    extends:
      file: ../../_common/base.yaml
      service: x-postgres
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/docker/vaultwarden/vw-data/:/data/
    environment:
      IP_HEADER: X-Forwarded-For
      IP_HEADER_TRUSTED_PROXIES: 172.20.0.251/32
      DATABASE_URL: postgresql://${PG_USER:-vaultwarden}:${PG_PASS:?URL-safe database password required}@postgres:5432/${PG_DB:-vaultwarden}
    env_file: .env
    networks:
      - pangolin
      - database
    deploy:
      resources:
        limits:
          memory: ${VAULTWARDEN_MEM_LIMIT:-512m}
    extends:
      file: ../../_common/base.yaml
      service: x-defaults
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

networks:
  database:
    internal: true
  pangolin:
    external: true
    name: pangolin
